<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeApprox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #1c2430;
  --muted: #6b7685;
  --line: #d9dee4;
  --transit: #2b5a8c;
  --walk: #3e8a5e;
  --error: #b3261e;
  --good: #1f8a54;
  --bad: #8e1b1b;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b22;
    --surface: #1f262f;
    --ink: #e6eaef;
    --muted: #97a1ae;
    --line: #333c47;
    --transit: #7fb0e3;
    --walk: #7cc79a;
    --error: #f2b8b5;
    --good: #2f9e64;
    --bad: #b02a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b22; --surface: #1f262f; --ink: #e6eaef; --muted: #97a1ae;
  --line: #333c47; --transit: #7fb0e3; --walk: #7cc79a; --error: #f2b8b5;
  --good: #2f9e64; --bad: #b02a2a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem .75rem 3rem; }
.top { display: flex; align-items: center; justify-content: space-between; margin: 0 0 1.25rem; }
h1 { font-size: 1.6rem; margin: 0; }
.gear { background: none; color: var(--muted); font-size: 1.4rem; padding: 0 .2rem; line-height: 1; }
.gear[aria-expanded="true"] { color: var(--transit); }

form { display: grid; gap: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; }
.seg label { padding: .45rem .9rem; cursor: pointer; }
.seg input:checked + label { background: var(--transit); color: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--transit); outline-offset: -4px; }
input[type=text], input[type=date], input[type=time] {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem;
}
input[type=text] { flex: 1 1 14rem; }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 8px;
  padding: .6rem 1.2rem; background: var(--transit); color: var(--bg); cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--transit); outline-offset: 2px; }

#status { color: var(--muted); margin: .75rem 0 .5rem; }
#status:empty { display: none; }
#status.error { color: var(--error); }

ol { list-style: none; padding: 0; margin: 0; }
li { padding: .8rem 0; border-bottom: 1px solid var(--line); }
/* Each connection is a card. */
#results { display: grid; gap: .75rem; }
#results > li {
  padding: .75rem .9rem; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.times { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.times .push { margin-left: auto; }
.times .tt, .dur, .past-tag { white-space: nowrap; }

/* Duration pill, colored on the scale best (--good) → worst (--bad). */
.dur {
  font-size: .9rem; font-weight: 700; color: #fff; border-radius: 999px;
  padding: .05rem .55rem; background: var(--muted);
}
/* Summary card: grid, one row per measure.
   icon | range (fills) | ✂ slot | ↺ slot  — slots fixed so rows align. */
#summary {
  display: grid; grid-template-columns: auto minmax(0, 1fr) 1.6rem 1.6rem; gap: .35rem .6rem;
  align-items: center; margin: .75rem 0; padding: .5rem .75rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  color: var(--muted);
}
#summary .icon { color: var(--transit); font-weight: 700; width: 1.2rem; text-align: center; }
/* Range may wrap (narrow phones) instead of pushing the buttons out. */
#summary .range { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .4rem; min-width: 0; }
#summary .range .dur, #summary .range .jump { white-space: nowrap; }
#summary .slot { display: flex; justify-content: center; }
#summary .jump { cursor: pointer; }
#summary .jump:hover { outline: 2px solid var(--transit); outline-offset: 1px; border-radius: 4px; }
#summary .dur.jump:hover { border-radius: 999px; }
#summary:empty { display: none; }
button.more {
  display: block; width: 100%; margin: .75rem 0; background: var(--surface);
  color: var(--transit); border: 1px solid var(--line);
}
button.more:disabled { opacity: .6; cursor: default; }
/* Left already (up to RECENT_PAST_MIN before the asked time): run? */
#results > li.past { border-style: dashed; }
.past-tag {
  font-size: .8rem; font-weight: 700; color: var(--bad); border: 1px solid currentColor;
  border-radius: 999px; padding: 0 .45rem;
}
/* Small round icon buttons in the summary: cut the top value, reset the cap. */
.icon-btn {
  width: 1.6rem; height: 1.6rem; padding: 0; border-radius: 50%;
  background: var(--surface); color: var(--transit); border: 1px solid var(--line);
  font-size: .9rem; line-height: 1;
}
.meta { color: var(--muted); font-size: .95rem; }
li.clickable { cursor: pointer; }
#summary .toggle { cursor: pointer; display: flex; align-items: center; gap: .4rem; }
#summary .chips { flex-wrap: wrap; gap: .3rem; white-space: normal; }
.places {
  margin: 0 0 1rem; padding: .6rem .75rem; color: var(--muted); font-size: .95rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.places h2 { font-size: 1rem; margin: 0 0 .25rem; color: var(--ink); }
.places ul { list-style: none; padding: 0; margin: .5rem 0; }
/* Place row: ★ name ✎ × on one line, the stops wrapped underneath.
   ┌ ★ Zuhause                 ✎ × ┐
   │   Furtbach 2' · Ifang 6' · …  │ */
.places li {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: .1rem .5rem;
  align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--line);
}
.places li .pname { color: var(--ink); font-weight: 700; }
.places li .pstops { grid-column: 2 / -1; font-size: .85rem; }
.places li { grid-template-columns: auto minmax(0, 1fr) auto; }
.places h3 { font-size: .95rem; margin: .3rem 0 0; color: var(--ink); }
.places .stop-row.head { font-size: .75rem; color: var(--muted); padding: 0 .3rem; }
.places .stop-row.head span:nth-child(n+2) { text-align: center; }
/* Settings open: the search below is dimmed and inert. */
main.settings-open > :not(.top):not(#places-panel) { opacity: .35; pointer-events: none; }
.places .rm { background: none; color: var(--muted); padding: 0 .3rem; font-size: 1rem; line-height: 1; }
button.danger { color: var(--error); }
.places .icon-btn.on { color: var(--walk); border-color: var(--walk); }
.places li .pstops { overflow-wrap: anywhere; }
.places #place-form { display: grid; gap: .5rem; margin-top: .5rem; }
/* Stop row: name (fills) | minutes | secondary | × — fits a phone width. */
.places .stop-row { display: grid; grid-template-columns: minmax(0, 1fr) 3.8rem auto auto; gap: .4rem; align-items: center; }
.places .stop-row input[type=text] { min-width: 0; width: 100%; }
.places .stop-row input[type=number] { width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .3rem; }
.places .stop-row input[type=checkbox] { margin: 0; accent-color: var(--transit); }
.places .error { color: var(--error); margin: 0; }
.places .error:empty { display: none; }
button.ghost, label.ghost { background: var(--surface); color: var(--transit); border: 1px solid var(--line); }
label.ghost { font-weight: 700; border-radius: 8px; padding: .6rem 1.2rem; cursor: pointer; }
.places .exchange { margin-top: .6rem; }
.places #px-status:empty { display: none; }
.ends { flex-wrap: nowrap; }
/* Ab/An · 📅 · time · Jetzt · 🚆: one line from ~360 px (24-h clock). */
.when { gap: .3rem; }
#now { padding: .45rem .45rem; font-size: .9rem; }
.cal { padding: .45rem .6rem; font-weight: 400; white-space: nowrap; }
.go { padding: .45rem .8rem; font-size: 1.1rem; line-height: 1.3; }
.cal.other { color: var(--ink); border-color: var(--transit); }
.swap { padding: .45rem .7rem; font-size: 1.1rem; }
.dests { display: flex; flex-wrap: wrap; gap: .3rem; width: 100%; }
.dests:empty { display: none; }
.dest {
  display: inline-flex; align-items: center; gap: .2rem; font-size: .9rem;
  padding: .1rem .3rem .1rem .6rem; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
}
.dest .rm { background: none; color: var(--muted); padding: 0 .3rem; font-size: 1rem; line-height: 1; }
.chip {
  font-size: .8rem; font-weight: 700; padding: .05rem .5rem; border-radius: 999px;
  background: var(--surface); color: var(--transit); border: 1px solid var(--transit);
}
.chip.on { background: var(--transit); color: var(--bg); }
.caret { background: none; color: var(--muted); padding: 0 .3rem; font-size: 1rem; line-height: 1; }
#summary .toggle input { margin: 0; accent-color: var(--transit); }
.details { margin-top: .5rem; padding: .5rem 0 0; border-top: 1px solid var(--line); font-size: .95rem; cursor: default; }
.alt-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .4rem; }
.alt-btns .at { font-size: .85rem; font-weight: 700; margin-right: .2rem; }
.details .alt-btn {
  font-size: .85rem; font-weight: 700; padding: .3rem .7rem; margin: .3rem 0;
  background: var(--bg); color: var(--transit); border: 1px solid var(--line);
}
/* Alternatives at a transfer: mini timelines around the arrival there. */
.alts { margin: .4rem 0 .6rem; padding: .5rem .6rem; background: var(--bg); border-radius: 8px; }
.alts h4 { margin: 0 0 .3rem; font-size: .9rem; }
.alts .axis { position: relative; }
/* Planned arrival at the transfer, drawn in each mini bar. */
.alt-row .bar.mini .now {
  top: -3px; bottom: -3px; height: auto; width: 0; border-radius: 0;
  border-left: 2px dashed var(--ink); opacity: .5; pointer-events: none;
}
.alt-row { display: grid; grid-template-columns: 7.2rem 1fr 4.6rem; gap: .5rem; align-items: center; padding: .15rem 0; cursor: pointer; }
.alt-row .t::before { content: "▸ "; color: var(--muted); }
.alt-row.open .t::before { content: "▾ "; }
.alt-detail { margin: .1rem 0 .5rem; padding: .3rem .4rem; background: var(--surface); border-radius: 6px; }
.alt-detail .meta { font-size: .8rem; }
.alt-row .t { font-size: .85rem; }
.alt-row .d { font-size: .8rem; text-align: right; color: var(--muted); }
.alt-row .bar.mini { width: 100%; height: 14px; margin: 0; }
.alt-row .bar.mini .lbl { line-height: 14px; font-size: .65rem; }
.alt-row .bar.mini .walk, .alt-row .bar.mini .wait { top: 5px; height: 4px; }
.alt-row.earlier { opacity: .55; }
.alt-row.planned .t { font-weight: 700; }
.alt-row.planned .bar.mini { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.alts .legend { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
/* Leg table: time | on | line | direction | off | time. */
.legs { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 0 0 .4rem; }
.legs td { padding: .3rem .25rem; vertical-align: top; border-bottom: 1px solid var(--line); }
.legs tr:last-child td { border-bottom: 0; }
.legs .tm { white-space: nowrap; font-weight: 700; width: 2.8rem; }
.legs .tm.end { text-align: right; }
.legs .delay { color: var(--bad); font-size: .75rem; }
.legs .stop { overflow-wrap: anywhere; }
.legs .gl {
  display: inline-block; margin-top: .15rem; padding: 0 .3rem; min-width: 1.3rem; text-align: center;
  font-size: .72rem; font-weight: 700; line-height: 1.3; color: var(--muted);
  border: 1px solid var(--muted); border-radius: 3px;
}
.legs .ln { white-space: nowrap; width: 2.6rem; }
.legs .ln b {
  display: inline-block; min-width: 2.2rem; text-align: center; border-radius: 4px;
  padding: 0 .2rem; background: var(--transit); color: var(--bg); font-size: .8rem;
}
.legs tr.walk .ln b, .legs tr.change .ln b { background: none; color: var(--walk); border: 1px dashed var(--walk); }
.legs tr.change .ln b { color: var(--muted); border-color: var(--muted); }
.legs .dir { color: var(--muted); width: 3.6rem; cursor: pointer; overflow-wrap: anywhere; }
.legs .dir.open { color: var(--ink); }

/* Timeline: walk = dotted green, transit = solid blue, shared time axis. */
/* Track scrolls horizontally when zoomed; all tracks scroll together.
   touch-action keeps native pans but leaves pinch to our zoom handler. */
.track {
  overflow-x: auto; overflow-y: hidden; padding-top: 1.5rem;
  /* Bleed to the card edges: bars get nearly the full card width. */
  margin: .4rem calc(6px - .9rem); padding-inline: 0;
  scrollbar-width: none; touch-action: pan-x pan-y;
}
.track::-webkit-scrollbar { display: none; }
/* Whole list: native vertical scroll only; pinch and sideways swipes are
   handled by Timeline for all bars together. */
#results { touch-action: pan-y; }
.bar { position: relative; height: 18px; width: calc(100% * var(--zoom, 1)); }
.bar span { position: absolute; top: 0; height: 100%; border-radius: 4px; }
.bar .walk { background: repeating-linear-gradient(90deg, var(--walk) 0 4px, transparent 4px 7px); top: 7px; height: 4px; }
.bar .transit { background: var(--transit); }
/* Wait / platform change: thin muted track, visible only where no leg covers it. */
.bar .wait { background: var(--line); top: 7px; height: 4px; }
/* Transfer: gray block over the gap between two rides. */
.bar .xfer { background: var(--line); border-radius: 0; }
/* Labels inside bar segments; fitLabels() picks the longest text that fits. */
.bar .lbl {
  overflow: hidden; white-space: nowrap; text-align: center;
  font-size: .72rem; font-weight: 700; line-height: 18px;
}
.bar .transit.lbl { color: var(--bg); }
/* Stop bubble above the bar. Transfer: tip at the gap's middle.
   Start/end: tip at the bubble's left/right edge, so it stays inside the track. */
/* placePins() sets `left` (bubble box) and --tip (tip x inside the bubble),
   so a bubble may slide sideways as long as its tip stays over the stop. */
.bar .pin {
  top: auto; bottom: calc(100% + 5px); height: auto;
  padding: 0 .3rem; border-radius: 4px; white-space: nowrap;
  font-size: .72rem; line-height: 1.4; background: var(--muted); color: var(--bg);
}
.bar .pin::after {
  content: ""; position: absolute; left: var(--tip, 50%); top: 100%; margin-left: -4px;
  border: 4px solid transparent; border-top-color: var(--muted);
}
/* Custom place (Zuhause, Büro …) at a journey's start or end: green. */
.bar .pin.place { background: var(--walk); }
.bar .pin.place::after { border-top-color: var(--walk); }
.bar .pin.place::before { background: var(--walk); }
/* Second bubble row, used when names would overlap in one row. A thin line
   connects the raised bubble down to the bar. */
.track { --pin-row: 1.35rem; }
.track.two-rows { padding-top: calc(1.5rem + var(--pin-row)); }
.bar .pin.up { bottom: calc(100% + 5px + var(--pin-row)); }
.bar .pin.up::before {
  content: ""; position: absolute; left: var(--tip, 50%); top: 100%;
  width: 1px; height: calc(var(--pin-row) + 5px); background: var(--muted);
}

/* Place field with suggestion dropdown. */
.place { position: relative; flex: 1 1 14rem; }
.place input { width: 100%; }
/* Field holds a known place: ⌂ drawn inside, text shifted right. */
.place.known::before {
  content: "⌂"; position: absolute; left: .6rem; top: .45rem; line-height: 1.5;
  color: var(--walk); font-weight: 700; pointer-events: none;
}
.place.known input { padding-left: 1.7rem; }
/* × inside the field, shown once it has text. */
.place input { padding-right: 2rem; }
.place .clear {
  position: absolute; right: .25rem; top: .3rem; display: none;
  background: none; color: var(--muted); padding: .1rem .45rem; font-size: 1.1rem; line-height: 1.3;
}
.place.filled .clear { display: block; }
.sugg {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 2;
  margin: .2rem 0 0; padding: .25rem 0; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}
.sugg:empty { display: none; }
.sugg li { display: flex; align-items: center; gap: .5rem; padding: .35rem .6rem; border: 0; cursor: pointer; }
.sugg li:hover, .sugg li[aria-selected="true"] { background: var(--bg); }
.sugg .name { flex: 1; }
.sugg .group { color: var(--muted); font-size: .8rem; padding: .2rem .6rem 0; cursor: default; }
.sugg .group:hover { background: none; }
.star { background: none; color: var(--muted); padding: 0 .2rem; font-size: 1.1rem; line-height: 1; }
.star.on { color: var(--transit); }
/* Phones: smaller type so "11:42 – 12:13" and both pills fit on one line. */
@media (max-width: 480px) {
  body { font-size: 15px; }
  h1 { font-size: 1.3rem; margin-bottom: .9rem; }
  .times { font-size: 1.1rem; gap: .35rem; }
  .dur { font-size: .78rem; padding: 0 .45rem; }
  .past-tag { font-size: .72rem; padding: 0 .35rem; }
  .meta { font-size: .85rem; }
  .seg label { padding: .4rem .6rem; }
  #summary { font-size: .9rem; }
  #results > li { padding: .6rem .75rem; }
  .track { margin-inline: calc(6px - .75rem); }
  .legs { font-size: .8rem; }
}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>HomeApprox</h1>
  <button type="button" id="settings" class="gear" aria-label="Einstellungen" aria-expanded="false" aria-controls="places-panel">⚙</button>
</header>

<!-- Settings: custom places (name + stops with walk minutes). Opened by the gear. -->
<section id="places-panel" class="places" hidden>
  <h2>⌂ Orte</h2>
  <ul id="places-list"></ul>
  <div id="place-form">
    <h3 id="pf-title">Neuer Ort</h3>
    <input type="text" id="pf-name" placeholder="Name, z. B. Büro">
    <div class="stop-row head" aria-hidden="true"><span>Haltestelle</span><span>Min.</span><span title="Nebenhaltestelle">Neben</span><span></span></div>
    <div id="pf-stops"></div>
    <div class="row">
      <button type="button" id="pf-add" class="ghost">+ Haltestelle</button>
      <button type="button" id="pf-save">Speichern</button>
      <button type="button" id="pf-cancel" class="ghost" hidden>Abbrechen</button>
      <button type="button" id="pf-delete" class="ghost danger" hidden>Löschen</button>
    </div>
    <p id="pf-error" class="error" role="alert"></p>
  </div>
  <datalist id="stop-options"></datalist>
  <!-- Exchange: file download/upload, or a link carrying the places in its fragment. -->
  <div class="row exchange">
    <button type="button" id="px-export" class="ghost">Exportieren</button>
    <button type="button" id="px-link" class="ghost">Link kopieren</button>
    <label class="ghost file">Importieren<input type="file" id="px-import" accept="application/json,.json" hidden></label>
  </div>
  <p id="px-status" class="meta" role="status"></p>
</section>

<form id="form">
  <!-- Von: one place (Zuhause by default). Nach: one or more, as chips. -->
  <div class="row ends">
    <div class="place">
      <input type="text" id="origin" placeholder="Von, z. B. Zuhause" required
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="origin-sugg">
      <button type="button" class="clear" data-for="origin" aria-label="Von leeren" title="Leeren">×</button>
      <ul id="origin-sugg" class="sugg" role="listbox"></ul>
    </div>
    <button type="button" id="swap" class="ghost swap" aria-label="Von und Nach tauschen" title="Tauschen">⇅</button>
  </div>

  <div class="row">
    <div class="place">
      <input type="text" id="place" placeholder="Nach, z. B. Zürich HB" required
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg">
      <button type="button" class="clear" data-for="place" aria-label="Nach leeren" title="Leeren">×</button>
      <ul id="sugg" class="sugg" role="listbox"></ul>
    </div>
    <button type="button" id="add-dest" class="ghost swap" aria-label="Weiteres Ziel" title="Weiteres Ziel">+</button>
    <!-- Parked destinations; the field holds the current one. -->
    <div id="dests" class="dests"></div>
  </div>

  <div class="row when">
    <div class="seg" role="radiogroup" aria-label="Zeitbezug">
      <input type="radio" name="ref" id="r-dep" value="depart" checked><label for="r-dep">Ab</label>
      <input type="radio" name="ref" id="r-arr" value="arrive"><label for="r-arr">An</label>
    </div>
    <!-- Date is almost always today: a 📅 button, the input appears on demand. -->
    <button type="button" id="pick-date" class="ghost cal" aria-label="Datum wählen">📅</button>
    <input type="date" id="date" required hidden>
    <input type="time" id="time" required>
    <button type="button" id="now" class="ghost cal" title="Datum und Zeit auf jetzt">Jetzt</button>
    <button type="submit" class="go" aria-label="Suchen" title="Suchen">🚆</button>
  </div>

</form>

<!-- Walk toggle; render() moves it into the summary's third row. -->
<input type="checkbox" id="walk" checked hidden aria-label="Verbindungen mit zusätzlichem Fussweg zeigen">

<p id="status" role="status"></p>
<div id="summary"></div>
<button type="button" id="earlier" class="more" hidden>Frühere Verbindungen</button>
<ol id="results"></ol>
<button type="button" id="later" class="more" hidden>Spätere Verbindungen</button>
</main>

<script>
/*
 * Compares connections over all stops near home, incl. walking time.
 *
 *   Home ──walk──► Stop A ──transit──► Place
 *        ──walk──► Stop B ──transit──►
 *        ──walk──► ...
 *
 * Layers (each calls only the one below):
 *   UI ──► Planner (adds walking, merges, sorts) ──► TransportApi (HTTP)
 *   UI ──► Stations (recent + favorites) ──► localStorage
 */

// ---------- Config ----------

// Walk minutes from home to each stop. Names as known by the SBB timetable.
const HOME_STOPS = Object.freeze([
  { name: "Wallisellen, Furtbach", walkMin: 2 },
  { name: "Wallisellen, Ifang", walkMin: 6 },
  // Glatt has two stops: tram (T12) preferred, bus stop only where its
  // vehicle isn't covered by another connection (secondary).
  { name: "Wallisellen, Glatt (Tram)", walkMin: 13 },
  { name: "Wallisellen, Glatt (Bus)", walkMin: 14, secondary: true },
  { name: "Dietlikon", walkMin: 15 },
  { name: "Wallisellen", walkMin: 15 },
  // secondary: only kept if its first vehicle (bus 774) isn't already in
  // another connection, see dropCoveredSecondary().
  { name: "Wallisellen, Säntisstrasse", walkMin: 8, secondary: true },
]);

// Departure/arrival board per custom stop, see boardTimes(): the planner
// hides a bus when a walk reaches the same train, so we ask again at each
// bus/tram time within the window. Trains need no re-ask (same journeys).
const BOARD_LIMIT = 40;
const BOARD_MODES = Object.freeze(["bus", "tram"]);
const BOARD_MAX_REQUERIES = 6;
const REQUERY_LIMIT = 3;
// Board window around the base results' times at the custom end.
const BOARD_SLACK_MIN = 20;
// Results always cover at least this window after (Ab) / before (An) the
// asked time; stop queries page on until they do.
const MIN_WINDOW_MIN = 30;
// Ab: also connections that left up to this long ago (worth running?).
const RECENT_PAST_MIN = 5;
// "Frühere / Spätere Verbindungen" widen the window by this much.
const MORE_STEP_MIN = 30;
const MAX_PAGES = 4;
const ALT_BEFORE_MIN = 20; // alternatives at a transfer: earlier ones from arrival − this
const ALT_LIMIT = 6;
const ALT_EARLIER = 3; // shown before my arrival at the transfer
const ALT_LATER = 3; // shown after the planned departure

// Place: where a journey starts or ends. A station is one stop with no walk.
// A custom place is several stops, each with its own walk.
//   Zuhause ──2'──► Furtbach          station("Bern") ──0'──► Bern
//           ──6'──► Ifang
//           ──15'─► Wallisellen
// Rules that apply at a custom end: the walk there is ours (an API walk
// there means another stop was reached → drop), same vehicle boarded at
// two of its stops is pruned to the best one, secondary stops are dropped
// when covered, and its board is re-asked (see boardTimes).
// `home`: the default "Von". Seeded into storage on first run.
const ZUHAUSE = Object.freeze({ name: "Zuhause", custom: true, home: true, stops: HOME_STOPS });
const station = (name) => ({ name, custom: false, stops: [{ name, walkMin: 0 }] });
const asPlace = (p) => (typeof p === "string" ? station(p) : p);
const Side = Object.freeze({ FROM: "from", TO: "to" });

// Direction of the form; maps onto (from place, to place), see plan().
// OTHER: plain A → B search, no custom end.
const Direction = Object.freeze({ TO_HOME: "toHome", FROM_HOME: "fromHome", OTHER: "other" });
const TimeRef = Object.freeze({ DEPART: "depart", ARRIVE: "arrive" });
const BoardKind = Object.freeze({ DEPART: "depart", ARRIVE: "arrive" });
const LegKind = Object.freeze({ RIDE: "ride", WALK: "walk", CHANGE: "change" });
const TRANSFER_WALK_MAX_MIN = 5;
const WalkMode = Object.freeze({ SHOW: "show", HIDE: "hide" });
const CapKind = Object.freeze({ DURATION: "duration", CHANGES: "changes" });

const API_BASE = "https://transport.opendata.ch/v1";
const CONNECTIONS_PER_STOP = 6;
const MAX_RESULTS = 15;
const STOP_ABBR_MAX = 6;
const MS_PER_MIN = 60_000;
const MS_PER_SEC = 1_000;

const MIN_QUERY_CHARS = 2;
const MAX_SUGGESTIONS = 6;
const UMLAUT_VARIANTS = 4;
const MAX_RECENT = 5;
const DEBOUNCE_MS = 250;
const STORAGE_KEY = "homeapprox.stations";
const PLACES_KEY = "homeapprox.places";
const PLACE_ICON = "⌂";
const EXPORT_VERSION = 1;
const SHARE_PARAM = "places";
const EXPORT_FILE = "homeapprox-orte.json";

// ---------- TransportApi: raw HTTP, nothing else knows the API shape ----------

const TransportApi = (() => {
  const pad = (n) => String(n).padStart(2, "0");
  const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // Display name of a line. API gives category + number, e.g. T/15, S/19, B/759.
  // Trams get "T15", buses just the number, trains "S19", "IR36".
  function lineLabel(j) {
    const cat = (j.category || "").trim();
    const num = (j.number || "").trim();
    if (!num) {
      return cat;
    }
    if (cat === "B" || cat === "BUS" || num.startsWith(cat)) {
      return num;
    }
    return `${cat}${num}`;
  }

  // Transfer = gap between two consecutive rides; named after the stop where
  // the next ride is boarded. E.g. T15 ──► Bahnhofplatz/HB ┄► Zürich HB ──► S19:
  // one transfer, "Zürich HB", from T15 arrival to S19 departure.
  function toTransfers(legs) {
    const rides = legs.filter((l) => l.kind === LegKind.RIDE);
    return rides.slice(0, -1).map((r, i) => ({
      stop: rides[i + 1].from,
      from: r.arr,
      to: rides[i + 1].dep,
    }));
  }

  // Short walks are platform changes, not real walking.
  function walkKind(sec) {
    return sec < TRANSFER_WALK_MAX_MIN * 60 ? LegKind.CHANGE : LegKind.WALK;
  }

  // Live time of a stop event when the API has a prognosis, else schedule.
  // The API plans with live data but the *Timestamp fields are schedule, so
  // mixing them makes a late bus seem to leave before we arrive.
  //   { departureTimestamp: 17:53, prognosis: { departure: "…18:02" } }
  //   → { at: 18:02, delayMin: 9 }
  function liveTime(ev, which) {
    const sched = new Date(ev[`${which}Timestamp`] * MS_PER_SEC);
    const prog = ev.prognosis?.[which] ? new Date(ev.prognosis[which]) : null;
    const at = prog && !Number.isNaN(prog.getTime()) ? prog : sched;
    return { at, delayMin: Math.round((at - sched) / MS_PER_MIN) };
  }

  // One section as a leg: ride (with line), real walk, or short change walk.
  function toLeg(s) {
    const j = s.journey;
    const dep = liveTime(s.departure, "departure");
    const arr = liveTime(s.arrival, "arrival");
    const walkSec = s.walk?.duration ?? Math.round((arr.at - dep.at) / MS_PER_SEC);
    return {
      kind: j ? LegKind.RIDE : walkKind(walkSec),
      line: j ? lineLabel(j) : "",
      headsign: j?.to || "",
      from: s.departure.station.name,
      dep: dep.at,
      depDelayMin: dep.delayMin,
      platform: s.departure.platform || "",
      to: s.arrival.station.name,
      arrPlatform: s.arrival.platform || "",
      arr: arr.at,
      arrDelayMin: arr.delayMin,
      walkSec,
      tripId: j?.name || "",
      stops: (j?.passList || []).map((p) => p.station?.name).filter(Boolean),
    };
  }

  // Maps API connection to a plain trip: { from, to, dep, arr, lines, transfers, legs }.
  function toTrip(c) {
    const legs = (c.sections || []).map(toLeg);
    const rideLines = [...new Set(legs.filter((l) => l.kind === LegKind.RIDE).map((l) => l.line))];
    return {
      from: c.from.station.name,
      to: c.to.station.name,
      dep: liveTime(c.from, "departure").at,
      arr: liveTime(c.to, "arrival").at,
      lines: (rideLines.length ? rideLines : c.products || []).join(", "),
      transfers: toTransfers(legs),
      legs,
    };
  }

  async function stationNames(query) {
    const params = new URLSearchParams({ query, type: "station" });
    const res = await fetch(`${API_BASE}/locations?${params}`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    // Entries without id are shops, doctors … (the API's fallback), no stops.
    return (data.stations || []).filter((s) => s.id).map((s) => s.name).filter(Boolean);
  }

  // "Zurich HB" finds only shops; "Zuerich HB" finds the station.
  // One variant per a/o/u (→ ae/oe/ue), at most UMLAUT_VARIANTS.
  function umlautVariants(query) {
    if (/[äöüÄÖÜ]|ae|oe|ue/i.test(query)) {
      return [];
    }
    const out = [];
    for (const m of query.matchAll(/[aou]/gi)) {
      out.push(query.slice(0, m.index + 1) + "e" + query.slice(m.index + 1));
    }
    return out.slice(0, UMLAUT_VARIANTS);
  }

  // Station names matching a prefix, for the search help.
  async function locations(query) {
    const names = await stationNames(query);
    if (names.length) {
      return names;
    }
    const tries = await Promise.allSettled(umlautVariants(query).map(stationNames));
    const found = tries.flatMap((t) => (t.status === "fulfilled" ? t.value : []));
    return [...new Set(found)];
  }

  async function connections(from, to, at, timeRef, limit = CONNECTIONS_PER_STOP) {
    const params = new URLSearchParams({
      from,
      to,
      date: fmtDate(at),
      time: fmtTime(at),
      isArrivalTime: timeRef === TimeRef.ARRIVE ? "1" : "0",
      limit: String(limit),
    });

    const res = await fetch(`${API_BASE}/connections?${params}`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    return (data.connections || []).map(toTrip);
  }

  const fmtBoardTime = (d) => `${fmtDate(d)} ${fmtTime(d)}`;

  // Same board requested by several pairs in one search: fetch once.
  const boardCache = new Map();
  const BOARD_CACHE_MS = 60_000;

  async function board(params) {
    const key = params.toString();
    const hit = boardCache.get(key);
    if (hit && Date.now() - hit.at < BOARD_CACHE_MS) {
      return hit.data;
    }
    const data = fetch(`${API_BASE}/stationboard?${params}`).then((res) => {
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return res.json();
    });
    boardCache.set(key, { at: Date.now(), data });
    data.catch(() => boardCache.delete(key));
    return data;
  }

  // Bus/tram times at `station` from `at` on: departures (BoardKind.DEPART)
  // or arrivals (BoardKind.ARRIVE), live when known. Sorted, unique.
  async function boardTimes(station, at, kind) {
    const params = new URLSearchParams({
      station,
      datetime: fmtBoardTime(at),
      limit: String(BOARD_LIMIT),
      type: kind === BoardKind.ARRIVE ? "arrival" : "departure",
    });
    BOARD_MODES.forEach((m) => params.append("transportations[]", m));
    const data = await board(params);
    const which = kind === BoardKind.ARRIVE ? "arrival" : "departure";
    const times = (data.stationboard || [])
      .filter((e) => e.stop?.[`${which}Timestamp`])
      .map((e) => liveTime(e.stop, which).at.getTime());
    return [...new Set(times)].sort((a, b) => a - b).map((t) => new Date(t));
  }

  return { connections, locations, boardTimes, toTransfers };
})();

// ---------- Planner: domain logic, adds walking around the transit leg ----------

const AltRel = Object.freeze({ EARLIER: "earlier", PLANNED: "planned", LATER: "later" });
const minutesBetween = (a, b) => Math.round((b - a) / MS_PER_MIN);

const Planner = (() => {
  const shift = (d, min) => new Date(d.getTime() + min * MS_PER_MIN);

  // Connections until the window [t, t + MIN_WINDOW_MIN] (Ab) or
  // [t − MIN_WINDOW_MIN, t] (An) is covered: re-asks from just after the last
  // departure (or before the first arrival) found so far. Deduped.
  async function connectionsCovering(from, to, t, timeRef) {
    const depart = timeRef === TimeRef.DEPART;
    const edge = shift(t, depart ? MIN_WINDOW_MIN : -MIN_WINDOW_MIN);
    const seen = new Map();
    let at = t;
    for (let page = 0; page < MAX_PAGES; page++) {
      const trips = await TransportApi.connections(from, to, at, timeRef);
      const before = seen.size;
      trips.forEach((tr) => seen.set(`${tr.dep.getTime()}|${tr.arr.getTime()}|${tr.lines}`, tr));
      if (!trips.length || seen.size === before) {
        break;
      }
      const all = [...seen.values()];
      if (depart) {
        const last = new Date(Math.max(...all.map((tr) => tr.dep)));
        if (last >= edge) {
          break;
        }
        at = shift(last, 1);
      } else {
        const first = new Date(Math.min(...all.map((tr) => tr.arr)));
        if (first <= edge) {
          break;
        }
        at = shift(first, -1);
      }
    }
    return [...seen.values()];
  }

  // Which side is custom; the form's Direction for the UI (followUpSearch).
  //   from custom → fromHome, to custom → toHome, neither → other.
  // Both custom: fromHome (follow-up searches then run from the transfer).
  function dirOf(from, to) {
    if (from.custom) {
      return Direction.FROM_HOME;
    }
    return to.custom ? Direction.TO_HOME : Direction.OTHER;
  }

  // Full door-to-door journey for one trip between stop `sf` of place
  // `from` and stop `st` of place `to`. `query` records what was asked of
  // the API, so odd results can be traced.
  //   start ··walkStart··► transitStart ──rides──► transitEnd ··walkEnd··► end
  function toJourney(trip, ends, query) {
    const { from, sf, to, st } = ends;
    const dir = dirOf(from, to);
    const walkStartMin = from.custom ? sf.walkMin : 0;
    const walkEndMin = to.custom ? st.walkMin : 0;
    // homeStop: the custom end's stop (from side first); pruning keys on it.
    const homeStop = from.custom ? sf.name : to.custom ? st.name : undefined;
    return {
      stop: homeStop,
      homeStop,
      from: trip.from,
      to: trip.to,
      fromPlace: from.name,
      toPlace: to.name,
      fromStop: sf.name,
      toStop: st.name,
      walkStartMin,
      walkEndMin,
      start: shift(trip.dep, -walkStartMin),
      end: shift(trip.arr, walkEndMin),
      transitStart: trip.dep,
      transitEnd: trip.arr,
      lines: trip.lines,
      transfers: trip.transfers,
      legs: trip.legs,
      hasExtraWalk: trip.legs.some((l) => l.kind === LegKind.WALK),
      dir,
      homeEnd: from.custom || to.custom,
      query,
    };
  }

  // The walk at a custom end is ours. If the API adds its own there, it
  // reached a different stop than asked: drop the trip.
  //   from custom: [walk?] ride ... ride [walk]   ← first leg must be a ride
  //   to custom:   [walk] ride ... ride [walk?]   ← last leg must be a ride
  function endsAreClean(trip, from, to) {
    const legs = trip.legs;
    if (!legs.length) {
      return true;
    }
    const okFrom = !from.custom || legs[0].kind === LegKind.RIDE;
    const okTo = !to.custom || legs[legs.length - 1].kind === LegKind.RIDE;
    return okFrom && okTo;
  }

  // One stop pair. Ab: the ride must leave after walking to sf.
  // An: it must arrive before walking from st. Returns the raw trips too
  // (before the clean-end filter): their times frame the board window.
  async function forPairRaw(ends, at, timeRef) {
    const { from, sf, to, st } = ends;
    const t = timeRef === TimeRef.DEPART
      ? shift(at, from.custom ? sf.walkMin : 0)
      : shift(at, -(to.custom ? st.walkMin : 0));
    const trips = await connectionsCovering(sf.name, st.name, t, timeRef);
    const query = { from: sf.name, to: st.name, at: t, timeRef };
    const journeys = trips
      .filter((trip) => endsAreClean(trip, from, to))
      .map((trip) => toJourney(trip, ends, query));
    return { trips, journeys, asked: t };
  }

  const forPair = async (ends, at, timeRef) => (await forPairRaw(ends, at, timeRef)).journeys;

  // The planner returns only journeys best in arrival and changes, so a bus
  // from a custom stop is hidden whenever walking reaches the same train.
  // Asking again exactly at the bus's time reveals it: by then the walk
  // can't make that train. Window at the custom end = the base results'
  // span there; empty base → MIN_WINDOW_MIN from the asked time.
  //   from side: departures board, query Ab at each bus departure,
  //              keep trips whose first leg is that ride
  //   to side:   arrivals board, query An at each bus arrival,
  //              keep trips whose last leg is that ride
  async function forPairBoard(ends, side, base, at, timeRef) {
    const { from, sf, to, st } = ends;
    const fromSide = side === Side.FROM;
    const stop = fromSide ? sf : st;
    // Window: the raw trips' times at this end, plus the asked window when
    // the user's time refers to this end, ± slack.
    const times = base.trips.map((trip) => (fromSide ? trip.dep : trip.arr).getTime());
    const askedHere = fromSide ? timeRef === TimeRef.DEPART : timeRef === TimeRef.ARRIVE;
    if (askedHere) {
      times.push(base.asked.getTime(), shift(base.asked, fromSide ? MIN_WINDOW_MIN : -MIN_WINDOW_MIN).getTime());
    }
    if (!times.length) {
      return [];
    }
    const lo = shift(new Date(Math.min(...times)), -BOARD_SLACK_MIN);
    const hi = shift(new Date(Math.max(...times)), BOARD_SLACK_MIN);

    const kind = fromSide ? BoardKind.DEPART : BoardKind.ARRIVE;
    const board = await TransportApi.boardTimes(stop.name, lo, kind);
    const picked = board.filter((t) => t >= lo && t <= hi).slice(0, BOARD_MAX_REQUERIES);

    const ref = fromSide ? TimeRef.DEPART : TimeRef.ARRIVE;
    const settled = await Promise.allSettled(
      picked.map((t) => TransportApi.connections(sf.name, st.name, t, ref, REQUERY_LIMIT))
    );
    const matches = (trip, t) => {
      const legs = trip.legs;
      const leg = fromSide ? legs[0] : legs[legs.length - 1];
      const when = fromSide ? leg?.dep : leg?.arr;
      return leg?.kind === LegKind.RIDE && when?.getTime() === t.getTime();
    };
    const query = { from: sf.name, to: st.name, at: lo, timeRef, board: stop.name };
    let trips = [];
    settled.forEach((r, i) => {
      if (r.status === "fulfilled") {
        trips = trips.concat(r.value.filter((trip) => matches(trip, picked[i])));
      }
    });
    return trips
      .filter((trip) => endsAreClean(trip, from, to))
      .map((trip) => toJourney(trip, ends, query));
  }

  // One stop pair, complete: base query, then the board re-asks for each
  // custom side.
  async function forPairFull(ends, at, timeRef) {
    const base = await forPairRaw(ends, at, timeRef);
    const sides = [[Side.FROM, ends.from], [Side.TO, ends.to]].filter(([, p]) => p.custom);
    const extra = await Promise.all(sides.map(([side]) => forPairBoard(ends, side, base, at, timeRef)));
    return base.journeys.concat(...extra);
  }

  // Vehicle identity: API trip name (same bus at another stop has another time).
  const vehicleKey = (l) => `${l.line}#${l.tripId || l.dep.getTime()}`;

  // Ride at one end: first ride on the from side, last on the to side.
  const endRide = (j, side) => {
    const rides = j.legs.filter((l) => l.kind === LegKind.RIDE);
    return side === Side.FROM ? rides[0] : rides[rides.length - 1];
  };
  const endStop = (j, side) => (side === Side.FROM ? j.fromStop : j.toStop);

  // A secondary stop's journey is dropped if the vehicle at that end
  // already appears in any journey of the other stops.
  function dropCoveredSecondary(journeys, side, place) {
    const secondary = new Set(place.stops.filter((s) => s.secondary).map((s) => s.name));
    const isSecondary = (j) => secondary.has(endStop(j, side));
    const used = new Set(
      journeys.filter((j) => !isSecondary(j)).flatMap((j) =>
        j.legs.filter((l) => l.kind === LegKind.RIDE).map(vehicleKey))
    );
    return journeys.filter((j) => {
      if (!isSecondary(j)) {
        return true;
      }
      const ride = endRide(j, side);
      return !ride || !used.has(vehicleKey(ride));
    });
  }

  // Same vehicle at a custom end, same other end: only the best stop to
  // board/alight it is kept. E.g. T12 from Glatt (Tram) 09:55 (walk 13) vs.
  // Wallisellen Bahnhof 09:56 (walk 15), both arriving 10:13: leaving home
  // 09:42 beats 09:41.
  //   from side: same vehicle + same end   → latest start wins
  //   to side:   same vehicle + same start → earliest end wins
  // Ties stay (both shown).
  function dropDominatedBoarding(journeys, side) {
    const fromHome = side === Side.FROM;
    const groups = new Map();
    journeys.forEach((j) => {
      const ride = endRide(j, side);
      if (!ride) {
        return;
      }
      const key = `${vehicleKey(ride)}|${(fromHome ? j.end : j.start).getTime()}`;
      groups.set(key, [...(groups.get(key) || []), j]);
    });
    const drop = new Set();
    groups.forEach((g) => {
      const best = fromHome ? Math.max(...g.map((j) => j.start)) : Math.min(...g.map((j) => j.end));
      g.forEach((j) => {
        if ((fromHome ? j.start.getTime() : j.end.getTime()) !== best) {
          drop.add(j);
        }
      });
    });
    return journeys.filter((j) => !drop.has(j));
  }

  // Same rides at the same times = same journey (base query and board re-ask
  // can coincide); the first one wins.
  function dedupe(journeys) {
    const seen = new Set();
    return journeys.filter((j) => {
      const key = j.legs
        .filter((l) => l.kind === LegKind.RIDE)
        .map((l) => `${l.line}@${l.dep.getTime()}`)
        .join("|");
      if (seen.has(key)) {
        return false;
      }
      seen.add(key);
      return true;
    });
  }

  // After all pairs are queried:
  // Duplicates, covered secondary stops, dominated boardings; sorted.
  // Secondary check first: a covered secondary stop must not win the
  // dominance comparison against the primary stop it duplicates.
  function prune(journeys, from, to) {
    let pruned = dedupe(journeys);
    [[Side.FROM, from], [Side.TO, to]].forEach(([side, place]) => {
      if (place.custom) {
        pruned = dropDominatedBoarding(dropCoveredSecondary(pruned, side, place), side);
      }
    });
    return pruned.sort((a, b) => a.start - b.start);
  }

  // Window shown by visible(): Ab [at, at + 30], An [at − 30, at].
  const defaultRange = (at, timeRef) => timeRef === TimeRef.DEPART
    ? { lo: at, hi: shift(at, MIN_WINDOW_MIN) }
    : { lo: shift(at, -MIN_WINDOW_MIN), hi: at };

  // Direction + place(s) → [from, to] pairs. `origin` only for OTHER.
  //   toHome:   place → Zuhause     fromHome: Zuhause → place
  //   other:    origin → place
  function pairsFor(placeOrPlaces, dir, origin) {
    return [].concat(placeOrPlaces).map(asPlace).map((p) => {
      if (dir === Direction.TO_HOME) {
        return [p, ZUHAUSE];
      }
      return dir === Direction.FROM_HOME ? [ZUHAUSE, p] : [asPlace(origin), p];
    });
  }

  const pairLabel = ([from, to]) => `${from.name} → ${to.name}`;

  // Several (from, to) pairs: planned each, merged, ordered by departure;
  // failures labelled with the pair when there are several.
  async function planPairs(pairs, at, timeRef) {
    const settled = await Promise.allSettled(pairs.map(([f, t]) => planPlaces(f, t, at, timeRef)));
    const failed = [];
    let journeys = [];
    settled.forEach((r, i) => {
      if (r.status === "rejected") {
        failed.push(pairLabel(pairs[i]));
        return;
      }
      const tag = pairs.length > 1 ? `${pairLabel(pairs[i])}: ` : "";
      failed.push(...r.value.failed.map((f) => tag + f));
      journeys = journeys.concat(r.value.journeys);
    });
    journeys.sort((a, b) => a.start - b.start);
    return { journeys, failed, at, timeRef, ...defaultRange(at, timeRef) };
  }

  // Direction form of planPairs (tests, follow-up searches).
  const plan = (placeOrPlaces, at, dir, timeRef, origin) => planPairs(pairsFor(placeOrPlaces, dir, origin), at, timeRef);

  // Pruning of merged results: per pair, each with its own custom sides.
  function prunePairs(journeys, pairs) {
    const byPair = new Map(pairs.map((p) => [pairLabel(p), p]));
    const groups = new Map();
    journeys.forEach((j) => {
      const k = `${j.fromPlace} → ${j.toPlace}`;
      groups.set(k, [...(groups.get(k) || []), j]);
    });
    let out = [];
    groups.forEach((g, k) => {
      const [from, to] = byPair.get(k) || [station(""), station("")];
      out = out.concat(prune(g, from, to));
    });
    return out.sort((a, b) => a.start - b.start);
  }

  // Core: every stop pair of the two places (base query + board re-asks at
  // custom ends), all in parallel; one failing pair doesn't block the others.
  //   from.stops × to.stops → forPairFull
  async function planPlaces(from, to, at, timeRef) {
    const tasks = [];
    from.stops.forEach((sf) => to.stops.forEach((st) => tasks.push({
      label: from.custom && !to.custom ? sf.name : to.custom && !from.custom ? st.name : `${sf.name} → ${st.name}`,
      run: () => forPairFull({ from, sf, to, st }, at, timeRef),
    })));
    const settled = await Promise.allSettled(tasks.map((t) => t.run()));

    const failed = [];
    let journeys = [];
    settled.forEach((r, i) => {
      if (r.status === "rejected") {
        failed.push(tasks[i].label);
        return;
      }
      journeys = journeys.concat(r.value);
    });
    journeys = prune(journeys, from, to);

    // Keep journeys within the requested window, ordered by departure.
    const fits = timeRef === TimeRef.DEPART ? (j) => j.start >= at : (j) => j.end <= at;
    journeys = journeys.filter(fits).sort((a, b) => a.start - b.start);

    return { journeys, failed, at, timeRef, ...defaultRange(at, timeRef) };
  }

  // Applied on already fetched journeys, so toggling needs no new search.
  // Everything inside the MIN_WINDOW_MIN window is shown, however many;
  // beyond it, filled up to MAX_RESULTS.
  function visible(result, walkMode) {
    const { journeys, timeRef, lo, hi } = result;
    const shown = walkMode === WalkMode.HIDE ? journeys.filter((j) => !j.hasExtraWalk) : journeys;
    const inWindow = timeRef === TimeRef.DEPART
      ? (j) => j.start >= lo && j.start <= hi
      : (j) => j.end >= lo && j.end <= hi;
    const core = shown.filter(inWindow);
    const room = Math.max(0, MAX_RESULTS - core.length);
    const outside = shown.filter((j) => (timeRef === TimeRef.DEPART ? j.start > hi : j.end < lo));
    // Ab: next ones after the window; An: the latest ones before it.
    const rest = timeRef === TimeRef.DEPART ? outside.slice(0, room) : outside.slice(-room || outside.length);
    if (!room) {
      rest.length = 0;
    }
    return [...core, ...rest].sort((a, b) => a.start - b.start);
  }

  // Town part of a stop name: before the comma, else the first word.
  //   "Zürich, Bahnhofplatz/HB" → Zürich / Bahnhofplatz/HB
  //   "Zürich HB"               → Zürich / HB
  //   "Wallisellen"             → Wallisellen / (empty)
  function splitTown(name) {
    const comma = name.indexOf(", ");
    if (comma >= 0) {
      return { town: name.slice(0, comma), rest: name.slice(comma + 2) };
    }
    const space = name.indexOf(" ");
    return space < 0
      ? { town: name, rest: "" }
      : { town: name.slice(0, space), rest: name.slice(space + 1) };
  }

  // Abbreviation for the transfer bubble, max STOP_ABBR_MAX letters:
  // town initial + rest, the word "Bahnhof" dropped. A stop that is only a town
  // (also after dropping "Bahnhof") is the town itself, shortened.
  //   "Zürich Oerlikon"         → "ZOerli"
  //   "Zürich HB"               → "ZHB"
  //   "Zürich, Bahnhofplatz/HB" → "ZBahnh"
  //   "Wallisellen, Bahnhof"    → "Wallis"
  // Short name: town dropped when a distinct part remains, "Bahnhof" and
  // anything after it dropped, bracketed suffix dropped.
  //   "Wallisellen, Furtbach"       → "Furtbach"
  //   "Zürich HB"                   → "HB"
  //   "Zürich Oerlikon Bahnhof Ost" → "Oerlikon"
  //   "Wallisellen, Bahnhof"        → "Wallisellen"
  //   "Wallisellen, Glatt (Tram)"   → "Glatt"
  //   "Zürich Oerlikon, Bahnhof Ost"→ "Oerlikon"  (town itself is "City Part")
  function shortName(name) {
    const { town, rest } = splitTown(name);
    const core = rest
      .replace(/(^|[\s,])Bahnhof(?=$|[\s,]).*$/i, "")
      .replace(/\s*\(.*?\)\s*$/, "")
      .trim();
    if (core) {
      return core;
    }
    const space = town.indexOf(" ");
    return space < 0 ? town : town.slice(space + 1);
  }

  function stopAbbr(name) {
    const letters = (t) => t.replace(/[^\p{L}\p{N}]/gu, "");
    const { town, rest } = splitTown(name);
    const core = rest.replace(/(^|[\s,])Bahnhof(?=$|[\s,])/gi, " ").trim();
    if (!core) {
      return letters(town).slice(0, STOP_ABBR_MAX);
    }
    const prefix = letters(town).slice(0, 1);
    return prefix + letters(core).slice(0, STOP_ABBR_MAX - prefix.length);
  }

  // "Zürich" ~ "zurich" ~ "Zuerich".
  const fold = (t) => t.toLowerCase().replace(/([aou])e/g, "$1").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  // Suggestions for the place field: favorites and recent first, then API hits.
  async function suggest(query, known) {
    const q = fold(query);
    const local = known.filter((n) => fold(n).includes(q));
    if (query.length < MIN_QUERY_CHARS) {
      return local;
    }

    const remote = await TransportApi.locations(query);
    const fresh = remote.filter((n) => !local.includes(n));
    return local.concat(fresh).slice(0, MAX_SUGGESTIONS);
  }

  // Onward connections from a transfer stop to the journey's last station,
  // around the planned one. Arrival there (`x.from`) splits them:
  //   EARLIER: leaves before I arrive → only if my first ride is late
  //   PLANNED: same first ride as the proposal
  //   LATER:   fallback if I miss it
  //
  // Two queries, so a dense line can't fill the list with past ones only:
  //   earlier: from arrival − ALT_BEFORE_MIN, the last ALT_EARLIER before arrival
  //   from arrival on: all up to the planned departure + ALT_LATER after it
  //     (one more query if the first doesn't reach that far)
  async function alternatives(j, x) {
    const dest = j.to;
    const ask = (t) => TransportApi.connections(x.stop, dest, t, TimeRef.DEPART, ALT_LIMIT);
    const [before, after] = await Promise.all([ask(shift(x.from, -ALT_BEFORE_MIN)), ask(x.from)]);
    let onward = after.filter((t) => t.dep >= x.from);
    if (onward.length && onward.filter((t) => t.dep > x.to).length < ALT_LATER) {
      const last = new Date(Math.max(...onward.map((t) => t.dep)));
      onward = onward.concat((await ask(shift(last, 1))).filter((t) => t.dep > last));
    }
    const seen = new Set();
    const uniq = (t) => {
      const k = `${t.dep.getTime()}|${t.arr.getTime()}|${t.lines}`;
      return !seen.has(k) && seen.add(k);
    };
    const byDep = (a, b) => a.dep - b.dep;
    const earlier = before.filter((t) => t.dep < x.from).filter(uniq).sort(byDep).slice(-ALT_EARLIER);
    onward = onward.filter(uniq).sort(byDep);
    const upToPlanned = onward.filter((t) => t.dep <= x.to);
    const later = onward.filter((t) => t.dep > x.to).slice(0, ALT_LATER);
    const trips = [...earlier, ...upToPlanned, ...later];
    const nextRide = j.legs.find((l) => l.kind === LegKind.RIDE && l.dep.getTime() === x.to.getTime());
    const key = (l) => l && `${l.line}@${l.dep.getTime()}`;
    return trips.map((t) => {
      const first = t.legs.find((l) => l.kind === LegKind.RIDE);
      let rel = AltRel.LATER;
      if (key(first) === key(nextRide)) {
        rel = AltRel.PLANNED;
      } else if (t.dep < x.from) {
        rel = AltRel.EARLIER;
      }
      // wait: departure vs. my arrival at the stop (−4 = left 4 min before
      // I get there). delta: arrival at the destination vs. planned.
      return { trip: t, rel, wait: minutesBetween(x.from, t.dep), delta: minutesBetween(j.transitEnd, t.arr) };
    });
  }

  // New search from a transfer stop to the journey's destination place,
  // from my planned arrival there on.
  //   Bern → Zuhause, change at Zürich HB  ⇒  Zürich HB → Zuhause, ab 08:58
  function followUpSearch(j, x) {
    return { from: x.stop, to: j.toPlace, at: x.from, timeRef: TimeRef.DEPART };
  }

  // Entry point of the form. Ab also fetches what left up to
  // RECENT_PAST_MIN ago; `at` stays the asked time (for the "vor N Min." tag).
  async function searchPairs(pairs, at, timeRef) {
    const lookback = timeRef === TimeRef.DEPART ? RECENT_PAST_MIN : 0;
    const r = await planPairs(pairs, shift(at, -lookback), timeRef);
    const hi = timeRef === TimeRef.DEPART ? shift(at, MIN_WINDOW_MIN) : r.hi;
    return { ...r, at, hi, params: { pairs, timeRef } };
  }

  // Direction form of searchPairs (tests).
  const search = (places, at, dir, timeRef, origin) => searchPairs(pairsFor(places, dir, origin), at, timeRef);

  // "Frühere" / "Spätere": fetch the next MORE_STEP_MIN outside the window,
  // merge, widen the window.
  //   Ab: earlier = depart from lo − step; later = depart from hi
  //   An: earlier = arrive by lo;          later = arrive by hi + step
  async function extend(result, side) {
    const { pairs, timeRef } = result.params;
    const earlier = side === "earlier";
    const depart = timeRef === TimeRef.DEPART;
    const lo = earlier ? shift(result.lo, -MORE_STEP_MIN) : result.lo;
    const hi = earlier ? result.hi : shift(result.hi, MORE_STEP_MIN);
    let q;
    if (depart) {
      q = earlier ? lo : result.hi;
    } else {
      q = earlier ? result.lo : hi;
    }
    const more = await planPairs(pairs, q, timeRef);
    return {
      ...result,
      journeys: prunePairs([...result.journeys, ...more.journeys], pairs),
      failed: [...new Set([...result.failed, ...more.failed])],
      lo,
      hi,
    };
  }

  return { plan, planPlaces, planPairs, search, searchPairs, extend, visible, suggest, stopAbbr, shortName, alternatives, followUpSearch };
})();

// ---------- Stations: recent + favorites, persisted in localStorage ----------

const Stations = (() => {
  const load = () => {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { recent: [], favorites: [] };
    } catch {
      return { recent: [], favorites: [] };
    }
  };
  const save = (s) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch {
      // Storage unavailable (private mode): keep working without memory.
    }
  };

  // Most recently used first, capped; favorites are never dropped from recent.
  function touch(name) {
    const s = load();
    s.recent = [name, ...s.recent.filter((n) => n !== name)].slice(0, MAX_RECENT);
    save(s);
  }

  function toggleFavorite(name) {
    const s = load();
    const isFav = s.favorites.includes(name);
    s.favorites = isFav ? s.favorites.filter((n) => n !== name) : [...s.favorites, name];
    save(s);
    return !isFav;
  }

  const isFavorite = (name) => load().favorites.includes(name);
  const favorites = () => load().favorites;
  const recent = () => load().recent.filter((n) => !isFavorite(n));

  return { touch, toggleFavorite, isFavorite, favorites, recent };
})();

// ---------- Places: custom places (several stops + walk), persisted ----------

const Places = (() => {
  // Stored form of ZUHAUSE, used to seed an empty storage.
  const seed = () => [{
    name: ZUHAUSE.name,
    home: true,
    stops: ZUHAUSE.stops.map((s) => ({ name: s.name, walkMin: s.walkMin, ...(s.secondary ? { secondary: true } : {}) })),
  }];

  // Storage without a home place (first run, or saved before homes
  // existed) gets Zuhause added — unless one named so is already there.
  const load = () => {
    try {
      const list = JSON.parse(localStorage.getItem(PLACES_KEY)) || [];
      const hasHome = list.some((p) => p.home || p.name === ZUHAUSE.name);
      if (hasHome) {
        return list;
      }
      const seeded = [...seed(), ...list];
      save(seeded);
      return seeded;
    } catch {
      return seed();
    }
  };
  const save = (list) => {
    try {
      localStorage.setItem(PLACES_KEY, JSON.stringify(list));
    } catch {
      // Storage unavailable: places live for this page only.
    }
  };

  // Stored shape is the data only; `custom` is added on read.
  const toPlace = (p) => ({ name: p.name, custom: true, home: Boolean(p.home), stops: p.stops });

  // Home place first, then by name.
  const all = () => load().map(toPlace).sort((a, b) => Number(b.home) - Number(a.home) || a.name.localeCompare(b.name, "de"));
  const names = () => all().map((p) => p.name);
  const byName = (name) => all().find((p) => p.name === name) || null;
  const home = () => all().find((p) => p.home) || null;

  // A name typed or picked in a place field: custom place if one matches,
  // else a plain station.
  const resolve = (name) => byName(name) || station(name);

  // Validated { name, stops, home? }; throws a message for the form.
  // Stop: { name, walkMin, secondary? } — secondary stops are dropped when
  // their vehicle is already covered, see dropCoveredSecondary().
  function normalize(name, stops, home = false) {
    const n = name.trim();
    if (!n) {
      throw new Error("Name fehlt.");
    }
    const clean = stops
      .map((s) => ({
        name: String(s.name || "").trim(),
        walkMin: Math.max(0, Math.round(Number(s.walkMin) || 0)),
        ...(s.secondary ? { secondary: true } : {}),
      }))
      .filter((s) => s.name);
    if (!clean.length) {
      throw new Error("Mindestens eine Haltestelle.");
    }
    return { name: n, stops: clean, ...(home ? { home: true } : {}) };
  }

  // Insert or replace (by `oldName` when renaming). Only one home.
  function put(place, oldName = place.name) {
    const rest = load()
      .filter((p) => p.name !== oldName && p.name !== place.name)
      .map((p) => (place.home ? { ...p, home: false } : p));
    save([...rest, place]);
  }

  // Marks `name` as the default "Von".
  const setHome = (name) => save(load().map((p) => ({ ...p, home: p.name === name })));

  const remove = (name) => save(load().filter((p) => p.name !== name));

  // Exchange format, same for file and link:
  //   { "homeapprox": 1, "places": [{ "name", "home"?, "stops": [{ "name", "walkMin", "secondary"? }] }] }
  const exportJson = () => JSON.stringify({ homeapprox: EXPORT_VERSION, places: load() }, null, 2);

  // Merges: same name replaces, others are kept. Returns how many came in.
  function importJson(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error("Keine gültige Datei.");
    }
    if (!data || data.homeapprox !== EXPORT_VERSION || !Array.isArray(data.places)) {
      throw new Error("Kein HomeApprox-Export.");
    }
    data.places.forEach((p) => put(normalize(String(p.name || ""), Array.isArray(p.stops) ? p.stops : [], Boolean(p.home))));
    return data.places.length;
  }

  // Share link: the export in the URL fragment, so it never hits a server.
  const toLink = (base) => `${base}#${SHARE_PARAM}=${encodeURIComponent(exportJson())}`;

  // Places carried in a fragment, or null. Does not import by itself.
  function fromHash(hash) {
    const m = new RegExp(`^#?(?:.*&)?${SHARE_PARAM}=([^&]+)`).exec(hash || "");
    return m ? decodeURIComponent(m[1]) : null;
  }

  return { all, names, byName, home, setHome, resolve, normalize, put, remove, exportJson, importJson, toLink, fromHash };
})();

// ---------- UI ----------

const $ = (id) => document.getElementById(id);
const hhmm = (d) => d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", hour12: false });
const minutes = (a, b) => Math.round((b - a) / MS_PER_MIN);

const localDateValue = (d) => new Date(d.getTime() - d.getTimezoneOffset() * MS_PER_MIN).toISOString().slice(0, 10);

function initInputs() {
  $("origin").value = Places.home()?.name || "";
  onNow();
}

// 📅 alone means today; another day shows as "📅 Fr 24.10." on the button.
function showDate() {
  const btn = $("pick-date");
  const v = $("date").value;
  const today = v === localDateValue(new Date());
  btn.classList.toggle("other", !today);
  if (today) {
    btn.textContent = "📅";
    return;
  }
  const d = new Date(`${v}T00:00`);
  btn.textContent = `📅 ${d.toLocaleDateString("de-CH", { weekday: "short", day: "2-digit", month: "2-digit" })}`;
}

// Reveal the input and open the picker; hide it again once a day is chosen.
function onPickDate() {
  const input = $("date");
  input.hidden = false;
  if (typeof input.showPicker === "function") {
    try {
      input.showPicker();
    } catch {
      input.focus();
    }
  } else {
    input.focus();
  }
}

function onDateChange() {
  $("date").hidden = true;
  showDate();
}

// Duration color: share of --bad on the scale best → worst duration.
function durColor(min, best, worst) {
  const p = worst > best ? Math.round(((min - best) / (worst - best)) * 100) : 0;
  return `color-mix(in oklab, var(--bad) ${p}%, var(--good))`;
}

// Positions a bar segment on the shared time axis [t0, t1].
function segment(cls, from, to, t0, t1) {
  const span = document.createElement("span");
  const total = t1 - t0 || 1;
  span.className = cls;
  span.style.left = `${((from - t0) / total) * 100}%`;
  span.style.width = `${((to - from) / total) * 100}%`;
  return span;
}

// Segment with text candidates (longest first); fitLabels() picks one.
function labelled(cls, from, to, t0, t1, texts, title) {
  const span = segment(`${cls} lbl`, from, to, t0, t1);
  span.dataset.texts = JSON.stringify(texts);
  span.title = title;
  return span;
}

// Bubble above the bar for a stop, anchored at `at`. Text, row and exact
// position are chosen by fitPins() once the bar is laid out.
function stopPin(name, at, t0, t1, cls = "") {
  const pin = document.createElement("span");
  pin.className = `pin ${cls}`;
  pin.dataset.frac = String((at - t0) / (t1 - t0 || 1));
  pin.dataset.texts = JSON.stringify([...new Set([Planner.shortName(name), Planner.stopAbbr(name)])]);
  pin.title = name;
  return pin;
}

// A walk at the far end hides where the first/last ride starts/ends:
//   Selnau ····walk····► Zürich HB ──S9──► ...   → pin "Zürich HB" too.
// Walks between rides are already pinned as transfers.
function edgeWalkPins(j, t0, t1) {
  const rides = j.legs.filter((l) => l.kind === LegKind.RIDE);
  if (!rides.length) {
    return [];
  }

  const pins = [];
  const first = j.legs[0];
  const last = j.legs[j.legs.length - 1];
  if (first.kind === LegKind.WALK) {
    pins.push(stopPin(rides[0].from, rides[0].dep, t0, t1));
  }
  if (last.kind === LegKind.WALK) {
    const r = rides[rides.length - 1];
    pins.push(stopPin(r.to, r.arr, t0, t1));
  }
  return pins;
}

const PIN_GAP_PX = 3;
const PIN_ROWS = 2;
// Tip must stay this far inside the bubble (rounded corners).
const PIN_TIP_INSET_PX = 6;

// Places bubbles left to right. A bubble slides sideways as far as its tip
// stays over the stop; it goes to the lowest row with room, else fails.
//
//   tip range:   [anchor - w + inset, anchor - inset]
//   bar range:   [0, barW - w]
//   row range:   [rowEnd + gap, ∞)
//
//                 ┌───────────┐          row 1 (only if row 0 is full)
//   ┌────────┐┌───┤  Zürich HB│──┐
//   │ Selnau ││Wal│           │Fu│       row 0: slid right to free space
//   ═══╧═════════╧═══════╧═══════╧════   bar  (╧ = tip = stop)
// Returns [{ pin, left, row }] or null when PIN_ROWS rows don't suffice.
function placePins(pins, barW) {
  const items = pins
    .map((pin) => ({ pin, w: pin.offsetWidth, anchor: Number(pin.dataset.frac) * barW }))
    .sort((a, b) => a.anchor - b.anchor);

  const rowEnd = [];
  const placed = [];
  for (const it of items) {
    const minLeft = Math.max(0, it.anchor - it.w + PIN_TIP_INSET_PX);
    // Stop right at a bar edge: bubble hugs the edge, tip sits in its corner.
    const maxLeft = Math.max(minLeft, Math.min(barW - it.w, it.anchor - PIN_TIP_INSET_PX));

    let row = rowEnd.findIndex((end) => end + PIN_GAP_PX <= maxLeft);
    if (row === -1) {
      row = rowEnd.length;
    }
    if (row >= PIN_ROWS) {
      return null;
    }

    const left = Math.max(minLeft, (rowEnd[row] ?? -Infinity) + PIN_GAP_PX);
    rowEnd[row] = left + it.w;
    const tip = Math.min(it.w - PIN_TIP_INSET_PX, Math.max(PIN_TIP_INSET_PX, it.anchor - left));
    placed.push({ pin: it.pin, left, row, tip });
  }
  return placed;
}

// Per bar: longest text form that placePins() can lay out, same form for
// all bubbles of the bar so they read consistently. Full names on two rows
// beat abbreviations on one. Zooming in gives room.
function fitPins(root) {
  root.querySelectorAll(".bar").forEach((bar) => {
    const pins = [...bar.querySelectorAll(".pin")];
    if (!pins.length) {
      return;
    }
    const barW = bar.clientWidth;
    const forms = pins.map((p) => JSON.parse(p.dataset.texts));
    const levels = Math.max(...forms.map((f) => f.length));

    let placed = null;
    for (let lvl = 0; lvl < levels && !placed; lvl++) {
      pins.forEach((p, i) => {
        p.textContent = forms[i][Math.min(lvl, forms[i].length - 1)];
      });
      placed = placePins(pins, barW);
    }

    // Nothing fits even abbreviated: tips on the stops, single row, overlap.
    placed ||= pins.map((pin) => {
      const w = pin.offsetWidth;
      const left = Number(pin.dataset.frac) * barW - w / 2;
      return { pin, left, row: 0, tip: w / 2 };
    });

    placed.forEach(({ pin, left, row, tip }) => {
      pin.style.left = `${left}px`;
      pin.style.setProperty("--tip", `${tip}px`);
      pin.classList.toggle("up", row > 0);
    });
    bar.closest(".track")?.classList.toggle("two-rows", placed.some((p) => p.row > 0));
  });
}

// Must run once the bar is laid out: first text that fits, else none.
function fitLabels(root) {
  root.querySelectorAll(".lbl").forEach((el) => {
    const texts = JSON.parse(el.dataset.texts || "[]");
    el.textContent = "";
    for (const t of texts) {
      el.textContent = t;
      if (el.scrollWidth <= el.clientWidth) {
        return;
      }
    }
    el.textContent = "";
  });
  fitPins(root);
}

function renderJourney(j, t0, t1, scale, past) {
  const li = document.createElement("li");
  li.dataset.startFrac = String((j.start - t0) / (t1 - t0 || 1));
  li.dataset.endFrac = String((j.end - t0) / (t1 - t0 || 1));

  const times = document.createElement("div");
  times.className = "times";
  const tt = document.createElement("span");
  tt.className = "tt";
  tt.textContent = `${hhmm(j.start)} – ${hhmm(j.end)}`;
  times.append(tt);
  const dur = document.createElement("span");
  dur.className = "dur";
  const durMin = minutes(j.start, j.end);
  dur.textContent = `${durMin} Min.`;
  dur.style.background = durColor(durMin, scale.best, scale.worst);
  if (past) {
    const tag = document.createElement("span");
    tag.className = "past-tag";
    tag.textContent = past;
    tag.title = "Schon losgegangen: lohnt es sich zu rennen?";
    times.append(tag);
  }
  times.append(dur);
  // Tag + duration pushed to the right edge of the card.
  (times.querySelector(".past-tag") || dur).classList.add("push");

  const track = document.createElement("div");
  track.className = "track";
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.setAttribute("aria-hidden", "true");
  track.append(bar);
  // Home walk, a wait track under the whole transit span, gray transfer blocks,
  // then each API leg (ride = solid blue with line, walk = dotted; short change
  // walks are covered by the transfer block), then bubbles: start, transfers, end.
  const ownWalks = [
    ...(j.walkStartMin ? [segment("walk", j.start, j.transitStart, t0, t1)] : []),
    ...(j.walkEndMin ? [segment("walk", j.transitEnd, j.end, t0, t1)] : []),
  ];
  const legSeg = (l) => {
    if (l.kind === LegKind.RIDE) {
      return labelled("transit", l.dep, l.arr, t0, t1, [l.line], `${l.line} → ${l.headsign}`);
    }
    return l.kind === LegKind.WALK ? segment("walk", l.dep, l.arr, t0, t1) : null;
  };
  bar.append(
    ...ownWalks,
    segment("wait", j.transitStart, j.transitEnd, t0, t1),
    ...j.transfers.map((x) => segment("xfer", x.from, x.to, t0, t1)),
    ...(j.legs.length
      ? j.legs.map(legSeg).filter(Boolean)
      : [labelled("transit", j.transitStart, j.transitEnd, t0, t1, [j.lines], j.lines)]),
    ...(j.walkStartMin ? [stopPin(j.fromPlace, j.start, t0, t1, "place")] : []),
    stopPin(j.from, j.transitStart, t0, t1),
    ...edgeWalkPins(j, t0, t1),
    ...j.transfers.map((x) =>
      stopPin(x.stop, new Date((x.from.getTime() + x.to.getTime()) / 2), t0, t1)
    ),
    stopPin(j.to, j.transitEnd, t0, t1),
    ...(j.walkEndMin ? [stopPin(j.toPlace, j.end, t0, t1, "place")] : [])
  );

  li.append(times, track);

  // Click toggles the leg-by-leg detail.
  const details = renderDetails(j);
  details.hidden = true;
  li.append(details);
  li.classList.add("clickable");
  li.addEventListener("click", () => {
    details.hidden = !details.hidden;
  });

  return li;
}

// Leg table plus the API query, so a strange result can be traced back.
function renderDetails(j) {
  const box = document.createElement("div");
  box.className = "details";

  const legs = document.createElement("table");
  legs.className = "legs";
  legRows(j).forEach((r) => legs.append(legRow(r)));

  const q = document.createElement("div");
  q.className = "meta";
  const ref = j.query.timeRef === TimeRef.ARRIVE ? "an" : "ab";
  const board = j.query.board ? ` · via Abfahrtstafel ${j.query.board}` : "";
  q.textContent = `Abfrage: ${j.query.from} → ${j.query.to}, ${ref} ${hhmm(j.query.at)}${board}`;

  box.addEventListener("click", (e) => e.stopPropagation());
  box.append(legs);
  j.transfers.forEach((x) => box.append(altButton(j, x)));
  box.append(q);
  return box;
}

// Rows of the leg table, incl. our own walks at custom ends.
function legRows(j) {
  const api = j.legs.map((l) => ({ ...l, walkMin: Math.round(l.walkSec / 60) }));
  const walk = (min, from, to, dep, arr) => ({ kind: LegKind.WALK, walkMin: min, from, to, dep, arr });
  return [
    ...(j.walkStartMin ? [walk(j.walkStartMin, j.fromPlace, j.fromStop, j.start, j.transitStart)] : []),
    ...api,
    ...(j.walkEndMin ? [walk(j.walkEndMin, j.toStop, j.toPlace, j.transitEnd, j.end)] : []),
  ];
}

function cell(cls, text) {
  const td = document.createElement("td");
  td.className = cls;
  td.textContent = text;
  return td;
}

// One leg: rides show line + shortened direction (tap for full name);
// walks show "Fuss"/"Umst." and the minutes.
function legRow(l) {
  const tr = document.createElement("tr");
  tr.className = l.kind;
  const ride = l.kind === LegKind.RIDE;

  // Platform signs under both stops: departure and arrival.
  const from = cell("stop", l.from);
  const to = cell("stop", l.to);
  if (ride) {
    l.platform && from.append(platformSign(l.platform));
    l.arrPlatform && to.append(platformSign(l.arrPlatform));
  }

  const ln = document.createElement("td");
  ln.className = "ln";
  const badge = document.createElement("b");
  badge.textContent = ride ? l.line : l.kind === LegKind.WALK ? "Fuss" : "Umst.";
  ln.append(badge);

  const dir = cell("dir", ride ? `→ ${Planner.stopAbbr(l.headsign)}` : `${l.walkMin} Min.`);
  if (ride) {
    dir.title = l.headsign;
    dir.addEventListener("click", () => {
      const open = dir.classList.toggle("open");
      dir.textContent = `→ ${open ? l.headsign : Planner.stopAbbr(l.headsign)}`;
    });
  }

  tr.append(timeCell("tm", l.dep, l.depDelayMin), from, ln, dir, to, timeCell("tm end", l.arr, l.arrDelayMin));
  return tr;
}

// Platform as a small sign: the number in a box, like on the station.
function platformSign(platform) {
  const s = document.createElement("span");
  s.className = "gl";
  s.textContent = platform;
  s.title = `Gleis/Kante ${platform}`;
  s.setAttribute("aria-label", `Gleis/Kante ${platform}`);
  return s;
}

// Time with the delay against schedule when there is one: "18:02 +9".
function timeCell(cls, at, delayMin) {
  const td = cell(cls, hhmm(at));
  if (delayMin) {
    const d = document.createElement("span");
    d.className = "delay";
    d.textContent = `${delayMin > 0 ? "+" : ""}${delayMin}`;
    d.title = "Minuten gegenüber Fahrplan";
    td.append(" ", d);
  }
  return td;
}

// Button per transfer; loads and toggles the alternatives below it.
function altButton(j, x) {
  const wrap = document.createElement("div");
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "alt-btn";
  btn.textContent = "Alternativen";
  btn.title = `Alternativen ab ${x.stop}`;
  const panel = document.createElement("div");
  panel.hidden = true;
  let loaded = false;

  btn.addEventListener("click", async () => {
    panel.hidden = !panel.hidden;
    if (loaded || panel.hidden) {
      return;
    }
    loaded = true;
    panel.className = "alts";
    panel.textContent = "Suche …";
    try {
      renderAlternatives(panel, j, x, await Planner.alternatives(j, x));
    } catch (err) {
      loaded = false;
      panel.textContent = `Fehler: ${err.message}`;
    }
  });

  // Right: same parameters as a fresh search, results replace the list.
  const again = document.createElement("button");
  again.type = "button";
  again.className = "alt-btn";
  again.textContent = "Neue Suche";
  again.title = `Neue Suche ab ${x.stop}`;
  again.addEventListener("click", () => startSearch(Planner.followUpSearch(j, x)));

  const btns = document.createElement("div");
  btns.className = "alt-btns";
  const label = document.createElement("span");
  label.className = "at";
  label.textContent = `Ab ${x.stop}:`;
  btns.append(label, btn, again);
  wrap.append(btns, panel);
  return wrap;
}

// Legs of one alternative + changes and how it compares at the destination.
function renderAltDetail(a, j) {
  const box = document.createElement("div");
  box.className = "alt-detail";
  const table = document.createElement("table");
  table.className = "legs";
  a.trip.legs.forEach((l) => table.append(legRow({ ...l, walkMin: Math.round(l.walkSec / 60) })));

  const n = a.trip.transfers.length;
  const changes = n === 0 ? "direkt" : `${n}× umsteigen`;
  const delta = a.delta === 0 ? "wie geplant" : a.delta > 0 ? `${a.delta} Min. später als geplant` : `${-a.delta} Min. früher als geplant`;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${changes} · an ${j.to} ${hhmm(a.trip.arr)}, ${delta}`;
  box.append(table, meta);
  return box;
}

const ALT_REL_TEXT = {
  [AltRel.EARLIER]: "falls verspätet",
  [AltRel.PLANNED]: "geplant",
  [AltRel.LATER]: "verpasst",
};

// Mini timelines on a common axis; dashed line = my planned arrival at the
// transfer stop. Left of it: only reachable if that one is late.
function renderAlternatives(panel, j, x, alts) {
  panel.replaceChildren();
  const head = document.createElement("h4");
  head.textContent = `Ab ${x.stop} nach ${j.to} · an ${hhmm(x.from)}`;
  panel.append(head);

  if (!alts.length) {
    panel.append("Keine Verbindungen gefunden.");
    return;
  }

  const t0 = Math.min(x.from, ...alts.map((a) => a.trip.dep));
  const t1 = Math.max(...alts.map((a) => a.trip.arr));
  const axis = document.createElement("div");
  axis.className = "axis";

  alts.forEach((a) => {
    const row = document.createElement("div");
    row.className = `alt-row ${a.rel}`;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = `${hhmm(a.trip.dep)} – ${hhmm(a.trip.arr)}`;
    const bar = document.createElement("div");
    bar.className = "bar mini";
    a.trip.legs.forEach((l) => {
      if (l.kind === LegKind.RIDE) {
        bar.append(labelled("transit", l.dep, l.arr, t0, t1, [l.line], `${l.line} → ${l.headsign}`));
      } else if (l.kind === LegKind.WALK) {
        bar.append(segment("walk", l.dep, l.arr, t0, t1));
      }
    });
    if (!a.trip.legs.length) {
      bar.append(segment("transit", a.trip.dep, a.trip.arr, t0, t1));
    }
    const d = document.createElement("span");
    d.className = "d";
    const wait = a.wait === 0 ? "±0" : a.wait > 0 ? `+${a.wait}` : `−${-a.wait}`;
    d.textContent = a.rel === AltRel.PLANNED ? `${ALT_REL_TEXT[a.rel]} ${wait}` : `${wait} Min.`;
    d.title = `${ALT_REL_TEXT[a.rel]} · Abfahrt gegenüber meiner Ankunft hier`;
    bar.append(segment("now", x.from, x.from, t0, t1));
    row.append(t, bar, d);

    // Tap a row: its legs as table, like the connection details.
    const detail = renderAltDetail(a, j);
    detail.hidden = true;
    row.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      row.classList.toggle("open", !detail.hidden);
    });
    axis.append(row, detail);
  });

  panel.append(axis);
  requestAnimationFrame(() => fitLabels(panel));

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "Gestrichelt: geplante Ankunft hier. Blass: fährt vorher, nur erreichbar bei Verspätung. ± = Abfahrt gegenüber meiner Ankunft hier.";
  panel.append(legend);
}

// ---------- Place suggestions (one widget per field: Ort/Nach, Von) ----------

// `onPick(name)`: what a chosen suggestion does; default fills the field.
function placeField(inputId, listId, onPick = (name) => { $(inputId).value = name; markPlaces(); }) {
  const input = () => $(inputId);
  const list = () => $(listId);
  let timer = null;
  let seq = 0;

  function item(name) {
    const li = document.createElement("li");
    li.setAttribute("role", "option");

    const label = document.createElement("span");
    label.className = "name";
    label.textContent = Places.byName(name) ? `${PLACE_ICON} ${name}` : name;

    const star = document.createElement("button");
    star.type = "button";
    star.className = Stations.isFavorite(name) ? "star on" : "star";
    star.textContent = "★";
    star.setAttribute("aria-label", "Favorit");
    star.addEventListener("click", (e) => {
      e.stopPropagation();
      star.classList.toggle("on", Stations.toggleFavorite(name));
    });

    li.append(label);
    if (!Places.byName(name)) {
      li.append(star);
    }
    li.addEventListener("click", () => {
      onPick(name);
      close();
    });
    return li;
  }

  function group(text) {
    const li = document.createElement("li");
    li.className = "group";
    li.textContent = text;
    return li;
  }

  // Also cancels a pending lookup, so it can't pop up after a search started.
  function close() {
