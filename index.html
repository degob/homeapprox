<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeApprox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #1c2430;
  --muted: #6b7685;
  --line: #d9dee4;
  --transit: #2b5a8c;
  --walk: #3e8a5e;
  --error: #b3261e;
  --good: #1f8a54;
  --bad: #8e1b1b;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b22;
    --surface: #1f262f;
    --ink: #e6eaef;
    --muted: #97a1ae;
    --line: #333c47;
    --transit: #7fb0e3;
    --walk: #7cc79a;
    --error: #f2b8b5;
    --good: #2f9e64;
    --bad: #b02a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b22; --surface: #1f262f; --ink: #e6eaef; --muted: #97a1ae;
  --line: #333c47; --transit: #7fb0e3; --walk: #7cc79a; --error: #f2b8b5;
  --good: #2f9e64; --bad: #b02a2a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem .75rem 3rem; }
h1 { font-size: 1.6rem; margin: 0 0 1.25rem; }

form { display: grid; gap: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; }
.seg label { padding: .45rem .9rem; cursor: pointer; }
.seg input:checked + label { background: var(--transit); color: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--transit); outline-offset: -4px; }
input[type=text], input[type=date], input[type=time] {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem;
}
input[type=text] { flex: 1 1 14rem; }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 8px;
  padding: .6rem 1.2rem; background: var(--transit); color: var(--bg); cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--transit); outline-offset: 2px; }

#status { color: var(--muted); margin: 1.25rem 0 .5rem; min-height: 1.5em; }
#status.error { color: var(--error); }

ol { list-style: none; padding: 0; margin: 0; }
li { padding: .8rem 0; border-bottom: 1px solid var(--line); }
/* Each connection is a card. */
#results { display: grid; gap: .75rem; }
#results > li {
  padding: .75rem .9rem; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.times { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.times .push { margin-left: auto; }
.times .tt, .dur, .past-tag { white-space: nowrap; }

/* Duration pill, colored on the scale best (--good) → worst (--bad). */
.dur {
  font-size: .9rem; font-weight: 700; color: #fff; border-radius: 999px;
  padding: .05rem .55rem; background: var(--muted);
}
#summary { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: center; margin: 0 0 .75rem; color: var(--muted); }
#summary:empty { display: none; }
button.more {
  display: block; width: 100%; margin: .75rem 0; background: var(--surface);
  color: var(--transit); border: 1px solid var(--line);
}
button.more:disabled { opacity: .6; cursor: default; }
/* Left already (up to RECENT_PAST_MIN before the asked time): run? */
#results > li.past { border-style: dashed; }
.past-tag {
  font-size: .8rem; font-weight: 700; color: var(--bad); border: 1px solid currentColor;
  border-radius: 999px; padding: 0 .45rem;
}
#summary .item { display: flex; align-items: center; gap: .4rem; }
.meta { color: var(--muted); font-size: .95rem; }
li.clickable { cursor: pointer; }
.check { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .95rem; }
.details { margin-top: .5rem; padding: .5rem 0 0; border-top: 1px solid var(--line); font-size: .95rem; cursor: default; }
.alt-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .4rem; }
.alt-btns .at { font-size: .85rem; font-weight: 700; margin-right: .2rem; }
.details .alt-btn {
  font-size: .85rem; font-weight: 700; padding: .3rem .7rem; margin: .3rem 0;
  background: var(--bg); color: var(--transit); border: 1px solid var(--line);
}
/* Alternatives at a transfer: mini timelines around the arrival there. */
.alts { margin: .4rem 0 .6rem; padding: .5rem .6rem; background: var(--bg); border-radius: 8px; }
.alts h4 { margin: 0 0 .3rem; font-size: .9rem; }
.alts .axis { position: relative; }
/* Planned arrival at the transfer, drawn in each mini bar. */
.alt-row .bar.mini .now {
  top: -3px; bottom: -3px; height: auto; width: 0; border-radius: 0;
  border-left: 2px dashed var(--ink); opacity: .5; pointer-events: none;
}
.alt-row { display: grid; grid-template-columns: 7.2rem 1fr 4.6rem; gap: .5rem; align-items: center; padding: .15rem 0; cursor: pointer; }
.alt-row .t::before { content: "▸ "; color: var(--muted); }
.alt-row.open .t::before { content: "▾ "; }
.alt-detail { margin: .1rem 0 .5rem; padding: .3rem .4rem; background: var(--surface); border-radius: 6px; }
.alt-detail .meta { font-size: .8rem; }
.alt-row .t { font-size: .85rem; }
.alt-row .d { font-size: .8rem; text-align: right; color: var(--muted); }
.alt-row .bar.mini { width: 100%; height: 14px; margin: 0; }
.alt-row .bar.mini .lbl { line-height: 14px; font-size: .65rem; }
.alt-row .bar.mini .walk, .alt-row .bar.mini .wait { top: 5px; height: 4px; }
.alt-row.earlier { opacity: .55; }
.alt-row.planned .t { font-weight: 700; }
.alt-row.planned .bar.mini { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.alts .legend { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
/* Leg table: time | on | line | direction | off | time. */
.legs { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 0 0 .4rem; }
.legs td { padding: .3rem .25rem; vertical-align: top; border-bottom: 1px solid var(--line); }
.legs tr:last-child td { border-bottom: 0; }
.legs .tm { white-space: nowrap; font-weight: 700; width: 2.8rem; }
.legs .tm.end { text-align: right; }
.legs .stop { overflow-wrap: anywhere; }
.legs .gl { display: block; color: var(--muted); font-size: .75rem; }
.legs .ln { white-space: nowrap; width: 2.6rem; }
.legs .ln b {
  display: inline-block; min-width: 2.2rem; text-align: center; border-radius: 4px;
  padding: 0 .2rem; background: var(--transit); color: var(--bg); font-size: .8rem;
}
.legs tr.walk .ln b, .legs tr.change .ln b { background: none; color: var(--walk); border: 1px dashed var(--walk); }
.legs tr.change .ln b { color: var(--muted); border-color: var(--muted); }
.legs .dir { color: var(--muted); width: 3.6rem; cursor: pointer; overflow-wrap: anywhere; }
.legs .dir.open { color: var(--ink); }

/* Timeline: walk = dotted green, transit = solid blue, shared time axis. */
/* Track scrolls horizontally when zoomed; all tracks scroll together.
   touch-action keeps native pans but leaves pinch to our zoom handler. */
.track {
  overflow-x: auto; overflow-y: hidden; padding-top: 1.5rem;
  /* Bleed to the card edges: bars get nearly the full card width. */
  margin: .4rem calc(6px - .9rem); padding-inline: 0;
  scrollbar-width: none; touch-action: pan-x pan-y;
}
.track::-webkit-scrollbar { display: none; }
/* Whole list: native vertical scroll only; pinch and sideways swipes are
   handled by Timeline for all bars together. */
#results { touch-action: pan-y; }
.bar { position: relative; height: 18px; width: calc(100% * var(--zoom, 1)); }
.bar span { position: absolute; top: 0; height: 100%; border-radius: 4px; }
.bar .walk { background: repeating-linear-gradient(90deg, var(--walk) 0 4px, transparent 4px 7px); top: 7px; height: 4px; }
.bar .transit { background: var(--transit); }
/* Wait / platform change: thin muted track, visible only where no leg covers it. */
.bar .wait { background: var(--line); top: 7px; height: 4px; }
/* Transfer: gray block over the gap between two rides. */
.bar .xfer { background: var(--line); border-radius: 0; }
/* Labels inside bar segments; fitLabels() picks the longest text that fits. */
.bar .lbl {
  overflow: hidden; white-space: nowrap; text-align: center;
  font-size: .72rem; font-weight: 700; line-height: 18px;
}
.bar .transit.lbl { color: var(--bg); }
/* Stop bubble above the bar. Transfer: tip at the gap's middle.
   Start/end: tip at the bubble's left/right edge, so it stays inside the track. */
.bar .pin {
  top: auto; bottom: calc(100% + 5px); height: auto; transform: translateX(-50%);
  padding: 0 .3rem; border-radius: 4px; white-space: nowrap;
  font-size: .72rem; line-height: 1.4; background: var(--muted); color: var(--bg);
}
.bar .pin::after {
  content: ""; position: absolute; left: 50%; top: 100%; margin-left: -4px;
  border: 4px solid transparent; border-top-color: var(--muted);
}
.bar .pin.start { transform: none; }
.bar .pin.start::after { left: 0; margin-left: 0; }
.bar .pin.end { transform: translateX(-100%); }
.bar .pin.end::after { left: auto; right: 0; margin-left: 0; }

/* Place field with suggestion dropdown. */
.place { position: relative; flex: 1 1 14rem; }
.place input { width: 100%; }
.sugg {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 2;
  margin: .2rem 0 0; padding: .25rem 0; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}
.sugg:empty { display: none; }
.sugg li { display: flex; align-items: center; gap: .5rem; padding: .35rem .6rem; border: 0; cursor: pointer; }
.sugg li:hover, .sugg li[aria-selected="true"] { background: var(--bg); }
.sugg .name { flex: 1; }
.sugg .group { color: var(--muted); font-size: .8rem; padding: .2rem .6rem 0; cursor: default; }
.sugg .group:hover { background: none; }
.star { background: none; color: var(--muted); padding: 0 .2rem; font-size: 1.1rem; line-height: 1; }
.star.on { color: var(--transit); }
/* Phones: smaller type so "11:42 – 12:13" and both pills fit on one line. */
@media (max-width: 480px) {
  body { font-size: 15px; }
  h1 { font-size: 1.3rem; margin-bottom: .9rem; }
  .times { font-size: 1.1rem; gap: .35rem; }
  .dur { font-size: .78rem; padding: 0 .45rem; }
  .past-tag { font-size: .72rem; padding: 0 .35rem; }
  .meta { font-size: .85rem; }
  .seg label { padding: .4rem .6rem; }
  #summary { font-size: .9rem; }
  #results > li { padding: .6rem .75rem; }
  .track { margin-inline: calc(6px - .75rem); }
  .legs { font-size: .8rem; }
}
</style>
</head>
<body>
<main>
<h1>HomeApprox</h1>

<form id="form">
  <div class="row">
    <div class="seg" role="radiogroup" aria-label="Richtung">
      <input type="radio" name="dir" id="d-to" value="toHome" checked><label for="d-to">Nach Hause</label>
      <input type="radio" name="dir" id="d-from" value="fromHome"><label for="d-from">Von zu Hause</label>
      <input type="radio" name="dir" id="d-other" value="other"><label for="d-other">Anderer Ort</label>
    </div>
  </div>

  <!-- "Von" only for Anderer Ort; "place" is the one place (home modes) or "Nach". -->
  <div class="row" id="origin-row" hidden>
    <div class="place">
      <input type="text" id="origin" placeholder="Von, z. B. Zürich HB"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="origin-sugg">
      <ul id="origin-sugg" class="sugg" role="listbox"></ul>
    </div>
  </div>

  <div class="row">
    <div class="place">
      <input type="text" id="place" placeholder="Ort, z. B. Zürich HB" required
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg">
      <ul id="sugg" class="sugg" role="listbox"></ul>
    </div>
  </div>

  <div class="row">
    <div class="seg" role="radiogroup" aria-label="Zeitbezug">
      <input type="radio" name="ref" id="r-dep" value="depart" checked><label for="r-dep">Ab</label>
      <input type="radio" name="ref" id="r-arr" value="arrive"><label for="r-arr">An</label>
    </div>
    <input type="date" id="date" required>
    <input type="time" id="time" required>
    <button type="submit">Suchen</button>
  </div>

  <div class="row">
    <label class="check"><input type="checkbox" id="walk" checked> Verbindungen mit zusätzlichem Fussweg zeigen</label>
  </div>
</form>

<p id="status" role="status"></p>
<div id="summary"></div>
<button type="button" id="earlier" class="more" hidden>Frühere Verbindungen</button>
<ol id="results"></ol>
<button type="button" id="later" class="more" hidden>Spätere Verbindungen</button>
</main>

<script>
/*
 * Compares connections over all stops near home, incl. walking time.
 *
 *   Home ──walk──► Stop A ──transit──► Place
 *        ──walk──► Stop B ──transit──►
 *        ──walk──► ...
 *
 * Layers (each calls only the one below):
 *   UI ──► Planner (adds walking, merges, sorts) ──► TransportApi (HTTP)
 *   UI ──► Stations (recent + favorites) ──► localStorage
 */

// ---------- Config ----------

// Walk minutes from home to each stop. Names as known by the SBB timetable.
const HOME_STOPS = Object.freeze([
  { name: "Wallisellen, Furtbach", walkMin: 2 },
  { name: "Wallisellen, Ifang", walkMin: 6 },
  // Glatt has two stops: tram (T12) preferred, bus stop only where its
  // vehicle isn't covered by another connection (secondary).
  { name: "Wallisellen, Glatt (Tram)", walkMin: 13 },
  { name: "Wallisellen, Glatt (Bus)", walkMin: 14, secondary: true },
  { name: "Dietlikon", walkMin: 15 },
  { name: "Wallisellen", walkMin: 15 },
  // secondary: only kept if its first vehicle (bus 774) isn't already in
  // another connection, see dropCoveredSecondary().
  { name: "Wallisellen, Säntisstrasse", walkMin: 8, secondary: true },
]);

// Feeder lines: the API often replaces a short bus/tram ride from a home stop
// by a walk (walk = later departure, same arrival), so it never offers them.
// We build these ourselves: departure board for the feeder + connections from
// the hub where it ends.
//   Home ──walk──► stop ──line──► alight ┄change┄► hub ──API──► Place
// stop:   HOME_STOPS name (walk time). board: timetable name of the stop where
//         the line halts (may differ, e.g. "(Bus)"/"(Tram)").
// alight: stop of the line near the hub. hub: station for the API query.
const FEEDERS = Object.freeze([
  { stop: "Wallisellen, Furtbach", board: "Wallisellen, Furtbach", lines: ["772"], mode: "bus",
    alight: "Wallisellen, Bahnhof", hub: "Wallisellen", changeMin: 4 },
  { stop: "Wallisellen, Ifang", board: "Wallisellen, Ifang", lines: ["787"], mode: "bus",
    alight: "Dietlikon, Bahnhof Ost", hub: "Dietlikon", changeMin: 4 },
  { stop: "Wallisellen, Ifang", board: "Wallisellen, Ifang", lines: ["787"], mode: "bus",
    alight: "Zürich Oerlikon, Bahnhof Ost", hub: "Zürich Oerlikon", changeMin: 5 },
  { stop: "Wallisellen, Glatt (Bus)", board: "Wallisellen, Glatt (Bus)", lines: ["787"], mode: "bus",
    alight: "Zürich Oerlikon, Bahnhof Ost", hub: "Zürich Oerlikon", changeMin: 5 },
  { stop: "Wallisellen, Glatt (Bus)", board: "Wallisellen, Glatt (Bus)", lines: ["61"], mode: "bus",
    alight: "Zürich Oerlikon, Bahnhof", hub: "Zürich Oerlikon", changeMin: 5 },
  { stop: "Wallisellen, Glatt (Tram)", board: "Wallisellen, Glatt (Tram)", lines: ["12"], mode: "tram",
    alight: "Stettbach, Bahnhof", hub: "Stettbach", changeMin: 4 },
]);
const BOARD_LIMIT = 80;
// Results always cover at least this window after (Ab) / before (An) the
// asked time; stop queries page on until they do.
const MIN_WINDOW_MIN = 30;
// Ab: also connections that left up to this long ago (worth running?).
const RECENT_PAST_MIN = 5;
// "Frühere / Spätere Verbindungen" widen the window by this much.
const MORE_STEP_MIN = 30;
const MAX_PAGES = 4;
const ALT_BEFORE_MIN = 20; // alternatives at a transfer: earlier ones from arrival − this
const ALT_LIMIT = 6;
const ALT_EARLIER = 3; // shown before my arrival at the transfer
const ALT_LATER = 3; // shown after the planned departure
const BOARD_LOOKBACK_MIN = 60; // board window before the first hub train (arrive mode)
const FEEDER_ARRIVE_SLACK_MIN = 25; // rough feeder ride + change, toHome + arrive
const FEEDER_MAX_WAIT_MIN = 20; // longer wait at the hub: feeder makes no sense

// OTHER: plain A → B search, no home stops, no feeders, no home walk.
const Direction = Object.freeze({ TO_HOME: "toHome", FROM_HOME: "fromHome", OTHER: "other" });
const TimeRef = Object.freeze({ DEPART: "depart", ARRIVE: "arrive" });
const LegKind = Object.freeze({ RIDE: "ride", WALK: "walk", CHANGE: "change" });
const TRANSFER_WALK_MAX_MIN = 5;
const WalkMode = Object.freeze({ SHOW: "show", HIDE: "hide" });

const API_BASE = "https://transport.opendata.ch/v1";
const CONNECTIONS_PER_STOP = 6;
const MAX_RESULTS = 15;
const STOP_ABBR_MAX = 6;
const MS_PER_MIN = 60_000;
const MS_PER_SEC = 1_000;

const MIN_QUERY_CHARS = 3;
const MAX_SUGGESTIONS = 6;
const MAX_RECENT = 5;
const DEBOUNCE_MS = 250;
const STORAGE_KEY = "homeapprox.stations";

// ---------- TransportApi: raw HTTP, nothing else knows the API shape ----------

const TransportApi = (() => {
  const pad = (n) => String(n).padStart(2, "0");
  const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // Display name of a line. API gives category + number, e.g. T/15, S/19, B/759.
  // Trams get "T15", buses just the number, trains "S19", "IR36".
  function lineLabel(j) {
    const cat = (j.category || "").trim();
    const num = (j.number || "").trim();
    if (!num) {
      return cat;
    }
    if (cat === "B" || cat === "BUS" || num.startsWith(cat)) {
      return num;
    }
    return `${cat}${num}`;
  }

  // Transfer = gap between two consecutive rides; named after the stop where
  // the next ride is boarded. E.g. T15 ──► Bahnhofplatz/HB ┄► Zürich HB ──► S19:
  // one transfer, "Zürich HB", from T15 arrival to S19 departure.
  function toTransfers(legs) {
    const rides = legs.filter((l) => l.kind === LegKind.RIDE);
    return rides.slice(0, -1).map((r, i) => ({
      stop: rides[i + 1].from,
      from: r.arr,
      to: rides[i + 1].dep,
    }));
  }

  // Short walks are platform changes, not real walking.
  function walkKind(sec) {
    return sec < TRANSFER_WALK_MAX_MIN * 60 ? LegKind.CHANGE : LegKind.WALK;
  }

  // One section as a leg: ride (with line), real walk, or short change walk.
  function toLeg(s) {
    const j = s.journey;
    const dep = new Date(s.departure.departureTimestamp * MS_PER_SEC);
    const arr = new Date(s.arrival.arrivalTimestamp * MS_PER_SEC);
    const walkSec = s.walk?.duration ?? Math.round((arr - dep) / MS_PER_SEC);
    return {
      kind: j ? LegKind.RIDE : walkKind(walkSec),
      line: j ? lineLabel(j) : "",
      headsign: j?.to || "",
      from: s.departure.station.name,
      dep,
      platform: s.departure.platform || "",
      to: s.arrival.station.name,
      arr,
      walkSec,
      tripId: j?.name || "",
      stops: (j?.passList || []).map((p) => p.station?.name).filter(Boolean),
    };
  }

  // Maps API connection to a plain trip: { from, to, dep, arr, lines, transfers, legs }.
  function toTrip(c) {
    const legs = (c.sections || []).map(toLeg);
    const rideLines = [...new Set(legs.filter((l) => l.kind === LegKind.RIDE).map((l) => l.line))];
    return {
      from: c.from.station.name,
      to: c.to.station.name,
      dep: new Date(c.from.departureTimestamp * MS_PER_SEC),
      arr: new Date(c.to.arrivalTimestamp * MS_PER_SEC),
      lines: (rideLines.length ? rideLines : c.products || []).join(", "),
      transfers: toTransfers(legs),
      legs,
    };
  }

  // Station names matching a prefix, for the search help.
  async function locations(query) {
    const params = new URLSearchParams({ query, type: "station" });
    const res = await fetch(`${API_BASE}/locations?${params}`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    return (data.stations || []).map((s) => s.name).filter(Boolean);
  }

  async function connections(from, to, at, timeRef, limit = CONNECTIONS_PER_STOP) {
    const params = new URLSearchParams({
      from,
      to,
      date: fmtDate(at),
      time: fmtTime(at),
      isArrivalTime: timeRef === TimeRef.ARRIVE ? "1" : "0",
      limit: String(limit),
    });

    const res = await fetch(`${API_BASE}/connections?${params}`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    return (data.connections || []).map(toTrip);
  }

  const fmtBoardTime = (d) => `${fmtDate(d)} ${fmtTime(d)}`;

  // Same board requested by several feeders in one search: fetch once.
  const boardCache = new Map();
  const BOARD_CACHE_MS = 60_000;

  async function board(params) {
    const key = params.toString();
    const hit = boardCache.get(key);
    if (hit && Date.now() - hit.at < BOARD_CACHE_MS) {
      return hit.data;
    }
    const data = fetch(`${API_BASE}/stationboard?${params}`).then((res) => {
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return res.json();
    });
    boardCache.set(key, { at: Date.now(), data });
    data.catch(() => boardCache.delete(key));
    return data;
  }

  // Departure board: rides of `lines` from `station` that later halt at
  // `target`, as plain ride legs station → target.
  async function feederRides(station, target, lines, mode, at) {
    const params = new URLSearchParams({
      station,
      datetime: fmtBoardTime(at),
      limit: String(BOARD_LIMIT),
    });
    params.append("transportations[]", mode);
    const data = await board(params);
    return (data.stationboard || [])
      .filter((e) => lines.includes(String(e.number)))
      .map((e) => {
        const stopAt = (e.passList || []).find((p) => p.station?.name === target);
        if (!stopAt?.arrivalTimestamp) {
          return null;
        }
        return {
          kind: LegKind.RIDE,
          line: lineLabel(e),
          headsign: e.to || "",
          from: e.stop.station?.name || station,
          dep: new Date(e.stop.departureTimestamp * MS_PER_SEC),
          platform: e.stop.platform || "",
          to: target,
          arr: new Date(stopAt.arrivalTimestamp * MS_PER_SEC),
          walkSec: 0,
          tripId: e.name || "",
          stops: (e.passList || []).map((p) => p.station?.name).filter(Boolean),
        };
      })
      .filter(Boolean);
  }

  return { connections, locations, feederRides, toTransfers };
})();

// ---------- Planner: domain logic, adds walking around the transit leg ----------

const AltRel = Object.freeze({ EARLIER: "earlier", PLANNED: "planned", LATER: "later" });
const minutesBetween = (a, b) => Math.round((b - a) / MS_PER_MIN);

const Planner = (() => {
  const shift = (d, min) => new Date(d.getTime() + min * MS_PER_MIN);

  // Connections until the window [t, t + MIN_WINDOW_MIN] (Ab) or
  // [t − MIN_WINDOW_MIN, t] (An) is covered: re-asks from just after the last
  // departure (or before the first arrival) found so far. Deduped.
  async function connectionsCovering(from, to, t, timeRef) {
    const depart = timeRef === TimeRef.DEPART;
    const edge = shift(t, depart ? MIN_WINDOW_MIN : -MIN_WINDOW_MIN);
    const seen = new Map();
    let at = t;
    for (let page = 0; page < MAX_PAGES; page++) {
      const trips = await TransportApi.connections(from, to, at, timeRef);
      const before = seen.size;
      trips.forEach((tr) => seen.set(`${tr.dep.getTime()}|${tr.arr.getTime()}|${tr.lines}`, tr));
      if (!trips.length || seen.size === before) {
        break;
      }
      const all = [...seen.values()];
      if (depart) {
        const last = new Date(Math.max(...all.map((tr) => tr.dep)));
        if (last >= edge) {
          break;
        }
        at = shift(last, 1);
      } else {
        const first = new Date(Math.min(...all.map((tr) => tr.arr)));
        if (first <= edge) {
          break;
        }
        at = shift(first, -1);
      }
    }
    return [...seen.values()];
  }

  // Time to ask the API for, so that walking is already accounted for.
  // E.g. leave home 08:00, walk 15 → train must depart from 08:15.
  function queryTime(at, dir, timeRef, walkMin) {
    if (dir === Direction.FROM_HOME && timeRef === TimeRef.DEPART) {
      return shift(at, walkMin);
    }
    if (dir === Direction.TO_HOME && timeRef === TimeRef.ARRIVE) {
      return shift(at, -walkMin);
    }
    return at;
  }

  // Full door-to-door journey for one trip. `query` records what was asked
  // of the API, so odd results can be traced.
  function toJourney(trip, stop, dir, query) {
    const toHome = dir === Direction.TO_HOME;
    return {
      stop: toHome ? trip.to : trip.from,
      from: trip.from,
      to: trip.to,
      walkMin: stop.walkMin,
      homeStop: stop.name,
      walkFirst: !toHome,
      start: toHome ? trip.dep : shift(trip.dep, -stop.walkMin),
      end: toHome ? shift(trip.arr, stop.walkMin) : trip.arr,
      transitStart: trip.dep,
      transitEnd: trip.arr,
      lines: trip.lines,
      transfers: trip.transfers,
      legs: trip.legs,
      hasExtraWalk: trip.legs.some((l) => l.kind === LegKind.WALK),
      dir,
      homeEnd: dir !== Direction.OTHER,
      query,
    };
  }

  // The walk at the home end is ours (HOME_STOPS). If the API adds its own
  // there, it reached a different stop than asked: drop the trip.
  //   fromHome: [walk?] ride ... ride [walk]   ← first leg must not be a walk
  //   toHome:   [walk] ride ... ride [walk?]   ← last leg must not be a walk
  function homeEndIsClean(trip, dir) {
    const legs = trip.legs;
    if (!legs.length) {
      return true;
    }
    const homeLeg = dir === Direction.FROM_HOME ? legs[0] : legs[legs.length - 1];
    return homeLeg.kind === LegKind.RIDE;
  }

  async function forStop(stop, place, at, dir, timeRef) {
    const t = queryTime(at, dir, timeRef, stop.walkMin);
    const [from, to] = dir === Direction.TO_HOME ? [place, stop.name] : [stop.name, place];
    const trips = await connectionsCovering(from, to, t, timeRef);
    const query = { from, to, at: t, timeRef };
    return trips
      .filter((trip) => homeEndIsClean(trip, dir))
      .map((trip) => toJourney(trip, stop, dir, query));
  }

  // Feeder trip = feeder ride + hub trip (fromHome) or hub trip + feeder ride
  // (toHome). Matched so the change at the hub takes at least changeMin.
  //   fromHome: latest ride with arr + change ≤ hub dep
  //   toHome:   earliest ride with dep ≥ hub arr + change
  // Hub trip that rides the feeder line again or passes the feeder's own stop
  // goes back the way we came: nonsense. E.g. T12 Glatt → Stettbach, then
  // T12 Stettbach → Flughafen through Glatt again.
  function backtracks(hubTrip, f) {
    return hubTrip.legs.some((l) => l.kind === LegKind.RIDE &&
      (f.lines.includes(l.line.replace(/^T/, "")) || f.lines.includes(l.line) || l.stops.includes(f.board)));
  }

  function joinFeeder(hubTrip, rides, f, dir) {
    const fromHome = dir === Direction.FROM_HOME;
    const ride = fromHome
      ? rides.filter((r) => shift(r.arr, f.changeMin) <= hubTrip.dep).sort((a, b) => b.arr - a.arr)[0]
      : rides.filter((r) => r.dep >= shift(hubTrip.arr, f.changeMin)).sort((a, b) => a.dep - b.dep)[0];
    if (!ride || backtracks(hubTrip, f)) {
      return null;
    }
    const wait = fromHome ? minutesBetween(ride.arr, hubTrip.dep) : minutesBetween(hubTrip.arr, ride.dep);
    if (wait > FEEDER_MAX_WAIT_MIN) {
      return null;
    }
    const legs = fromHome ? [ride, ...hubTrip.legs] : [...hubTrip.legs, ride];
    const rideLines = [...new Set(legs.filter((l) => l.kind === LegKind.RIDE).map((l) => l.line))];
    return {
      from: fromHome ? ride.from : hubTrip.from,
      to: fromHome ? hubTrip.to : ride.to,
      dep: fromHome ? ride.dep : hubTrip.dep,
      arr: fromHome ? hubTrip.arr : ride.arr,
      lines: rideLines.join(", "),
      transfers: TransportApi.toTransfers(legs),
      legs,
    };
  }

  // One feeder: hub connections + departure board, sequenced so the board
  // window covers the hub trains (fromHome) or hub arrivals (toHome).
  async function forFeeder(f, place, at, dir, timeRef) {
    const stop = HOME_STOPS.find((s) => s.name === f.stop);
    const fromHome = dir === Direction.FROM_HOME;
    const [boardAt, target] = fromHome ? [f.board, f.alight] : [f.alight, f.board];
    const [from, to] = fromHome ? [f.hub, place] : [place, f.hub];
    let hubTrips;
    let rides;
    let hubTime;

    if (fromHome && timeRef === TimeRef.DEPART) {
      rides = await TransportApi.feederRides(boardAt, target, f.lines, f.mode, shift(at, stop.walkMin));
      if (!rides.length) {
        return [];
      }
      hubTime = shift(rides[0].arr, f.changeMin);
      hubTrips = await connectionsCovering(from, to, hubTime, timeRef);
    } else {
      hubTime = !fromHome && timeRef === TimeRef.ARRIVE
        ? shift(at, -stop.walkMin - FEEDER_ARRIVE_SLACK_MIN)
        : at;
      hubTrips = await connectionsCovering(from, to, hubTime, timeRef);
      hubTrips = hubTrips.filter((t) => homeEndIsClean(t, dir));
      if (!hubTrips.length) {
        return [];
      }
      const boardTime = fromHome
        ? shift(new Date(Math.min(...hubTrips.map((t) => t.dep))), -BOARD_LOOKBACK_MIN)
        : shift(new Date(Math.min(...hubTrips.map((t) => t.arr))), f.changeMin);
      rides = await TransportApi.feederRides(boardAt, target, f.lines, f.mode, boardTime);
    }

    const query = { from, to, at: hubTime, timeRef, feeder: `${f.lines.join("/")} ${f.board} ↔ ${f.alight}` };
    return hubTrips
      .filter((t) => homeEndIsClean(t, dir))
      .map((t) => joinFeeder(t, rides, f, dir))
      .filter(Boolean)
      .map((trip) => toJourney(trip, stop, dir, query));
  }

  // Vehicle identity: API trip name (same bus at another stop has another time).
  const vehicleKey = (l) => `${l.line}#${l.tripId || l.dep.getTime()}`;

  // Home-end ride: first ride from home, last ride to home.
  const homeRide = (j, dir) => {
    const rides = j.legs.filter((l) => l.kind === LegKind.RIDE);
    return dir === Direction.FROM_HOME ? rides[0] : rides[rides.length - 1];
  };

  // A secondary stop's journey is dropped if its home-end vehicle already
  // appears in any journey of the other stops.
  function dropCoveredSecondary(journeys, dir) {
    const secondary = new Set(HOME_STOPS.filter((s) => s.secondary).map((s) => s.name));
    const isSecondary = (j) => secondary.has(j.homeStop);
    const used = new Set(
      journeys.filter((j) => !isSecondary(j)).flatMap((j) =>
        j.legs.filter((l) => l.kind === LegKind.RIDE).map(vehicleKey))
    );
    return journeys.filter((j) => {
      if (!isSecondary(j)) {
        return true;
      }
      const ride = homeRide(j, dir);
      return !ride || !used.has(vehicleKey(ride));
    });
  }

  // Same home-end vehicle, same far end: only the best stop to board it is
  // kept. E.g. T12 from Glatt (Tram) 09:55 (walk 13) vs. Wallisellen Bahnhof
  // 09:56 (walk 15), both arriving 10:13: leaving home 09:42 beats 09:41.
  //   fromHome: same vehicle + same arrival → latest start wins
  //   toHome:   same vehicle + same departure → earliest end wins
  // Ties stay (both shown).
  function dropDominatedBoarding(journeys, dir) {
    const fromHome = dir === Direction.FROM_HOME;
    const groups = new Map();
    journeys.forEach((j) => {
      const ride = homeRide(j, dir);
      if (!ride) {
        return;
      }
      const key = `${vehicleKey(ride)}|${(fromHome ? j.end : j.start).getTime()}`;
      groups.set(key, [...(groups.get(key) || []), j]);
    });
    const drop = new Set();
    groups.forEach((g) => {
      const best = fromHome ? Math.max(...g.map((j) => j.start)) : Math.min(...g.map((j) => j.end));
      g.forEach((j) => {
        if ((fromHome ? j.start.getTime() : j.end.getTime()) !== best) {
          drop.add(j);
        }
      });
    });
    return journeys.filter((j) => !drop.has(j));
  }

  // Same rides at the same times = same journey (API result and feeder build
  // can coincide); the first one wins.
  function dedupe(journeys) {
    const seen = new Set();
    return journeys.filter((j) => {
      const key = j.legs
        .filter((l) => l.kind === LegKind.RIDE)
        .map((l) => `${l.line}@${l.dep.getTime()}`)
        .join("|");
      if (seen.has(key)) {
        return false;
      }
      seen.add(key);
      return true;
    });
  }

  // Queries all stops and feeders in parallel; one failing doesn't block the others.
  // Duplicates, covered secondary stops, dominated boardings; sorted.
  // Secondary check first: a covered secondary stop must not win the
  // dominance comparison against the primary stop it duplicates.
  function prune(journeys, dir) {
    const once = dedupe(journeys);
    const pruned = dir === Direction.OTHER ? once : dropDominatedBoarding(dropCoveredSecondary(once, dir), dir);
    return pruned.sort((a, b) => a.start - b.start);
  }

  // Window shown by visible(): Ab [at, at + 30], An [at − 30, at].
  const defaultRange = (at, timeRef) => timeRef === TimeRef.DEPART
    ? { lo: at, hi: shift(at, MIN_WINDOW_MIN) }
    : { lo: shift(at, -MIN_WINDOW_MIN), hi: at };

  // Anderer Ort: one pair, walks anywhere are the API's and stay.
  async function planOther(origin, place, at, timeRef) {
    const trips = await connectionsCovering(origin, place, at, timeRef);
    const query = { from: origin, to: place, at, timeRef };
    const stop = { name: origin, walkMin: 0 };
    const fits = timeRef === TimeRef.DEPART ? (j) => j.start >= at : (j) => j.end <= at;
    const journeys = dedupe(trips.map((t) => toJourney(t, stop, Direction.OTHER, query)))
      .filter(fits)
      .sort((a, b) => a.start - b.start);
    return { journeys, failed: [], at, timeRef, ...defaultRange(at, timeRef) };
  }

  // `origin` only for Direction.OTHER.
  async function plan(place, at, dir, timeRef, origin) {
    if (dir === Direction.OTHER) {
      return planOther(origin, place, at, timeRef);
    }
    const tasks = [
      ...HOME_STOPS.map((s) => ({ label: s.name, run: () => forStop(s, place, at, dir, timeRef) })),
      ...FEEDERS.map((f) => ({
        label: `${f.stop} (${f.lines.join("/")} → ${f.hub})`,
        run: () => forFeeder(f, place, at, dir, timeRef),
      })),
    ];
    const settled = await Promise.allSettled(tasks.map((t) => t.run()));

    const failed = [];
    let journeys = [];
    settled.forEach((r, i) => {
      if (r.status === "rejected") {
        failed.push(tasks[i].label);
        return;
      }
      journeys = journeys.concat(r.value);
    });
    journeys = prune(journeys, dir);

    // Keep journeys within the requested window, ordered by departure.
    const fits = timeRef === TimeRef.DEPART ? (j) => j.start >= at : (j) => j.end <= at;
    journeys = journeys.filter(fits).sort((a, b) => a.start - b.start);

    return { journeys, failed, at, timeRef, ...defaultRange(at, timeRef) };
  }

  // Applied on already fetched journeys, so toggling needs no new search.
  // Everything inside the MIN_WINDOW_MIN window is shown, however many;
  // beyond it, filled up to MAX_RESULTS.
  function visible(result, walkMode) {
    const { journeys, timeRef, lo, hi } = result;
    const shown = walkMode === WalkMode.HIDE ? journeys.filter((j) => !j.hasExtraWalk) : journeys;
    const inWindow = timeRef === TimeRef.DEPART
      ? (j) => j.start >= lo && j.start <= hi
      : (j) => j.end >= lo && j.end <= hi;
    const core = shown.filter(inWindow);
    const room = Math.max(0, MAX_RESULTS - core.length);
    const outside = shown.filter((j) => (timeRef === TimeRef.DEPART ? j.start > hi : j.end < lo));
    // Ab: next ones after the window; An: the latest ones before it.
    const rest = timeRef === TimeRef.DEPART ? outside.slice(0, room) : outside.slice(-room || outside.length);
    if (!room) {
      rest.length = 0;
    }
    return [...core, ...rest].sort((a, b) => a.start - b.start);
  }

  // Town part of a stop name: before the comma, else the first word.
  //   "Zürich, Bahnhofplatz/HB" → Zürich / Bahnhofplatz/HB
  //   "Zürich HB"               → Zürich / HB
  //   "Wallisellen"             → Wallisellen / (empty)
  function splitTown(name) {
    const comma = name.indexOf(", ");
    if (comma >= 0) {
      return { town: name.slice(0, comma), rest: name.slice(comma + 2) };
    }
    const space = name.indexOf(" ");
    return space < 0
      ? { town: name, rest: "" }
      : { town: name.slice(0, space), rest: name.slice(space + 1) };
  }

  // Abbreviation for the transfer bubble, max STOP_ABBR_MAX letters:
  // town initial + rest, the word "Bahnhof" dropped. A stop that is only a town
  // (also after dropping "Bahnhof") is the town itself, shortened.
  //   "Zürich Oerlikon"         → "ZOerli"
  //   "Zürich HB"               → "ZHB"
  //   "Zürich, Bahnhofplatz/HB" → "ZBahnh"
  //   "Wallisellen, Bahnhof"    → "Wallis"
  function stopAbbr(name) {
    const letters = (t) => t.replace(/[^\p{L}\p{N}]/gu, "");
    const { town, rest } = splitTown(name);
    const core = rest.replace(/(^|[\s,])Bahnhof(?=$|[\s,])/gi, " ").trim();
    if (!core) {
      return letters(town).slice(0, STOP_ABBR_MAX);
    }
    const prefix = letters(town).slice(0, 1);
    return prefix + letters(core).slice(0, STOP_ABBR_MAX - prefix.length);
  }

  // Suggestions for the place field: favorites and recent first, then API hits.
  async function suggest(query, known) {
    const q = query.toLowerCase();
    const local = known.filter((n) => n.toLowerCase().includes(q));
    if (query.length < MIN_QUERY_CHARS) {
      return local;
    }

    const remote = await TransportApi.locations(query);
    const fresh = remote.filter((n) => !local.includes(n));
    return local.concat(fresh).slice(0, MAX_SUGGESTIONS);
  }

  // Onward connections from a transfer stop to the journey's last station,
  // around the planned one. Arrival there (`x.from`) splits them:
  //   EARLIER: leaves before I arrive → only if my feeder is late
  //   PLANNED: same first ride as the proposal
  //   LATER:   fallback if I miss it
  //
  // Two queries, so a dense line can't fill the list with past ones only:
  //   earlier: from arrival − ALT_BEFORE_MIN, the last ALT_EARLIER before arrival
  //   from arrival on: all up to the planned departure + ALT_LATER after it
  //     (one more query if the first doesn't reach that far)
  async function alternatives(j, x) {
    const dest = j.to;
    const ask = (t) => TransportApi.connections(x.stop, dest, t, TimeRef.DEPART, ALT_LIMIT);
    const [before, after] = await Promise.all([ask(shift(x.from, -ALT_BEFORE_MIN)), ask(x.from)]);
    let onward = after.filter((t) => t.dep >= x.from);
    if (onward.length && onward.filter((t) => t.dep > x.to).length < ALT_LATER) {
      const last = new Date(Math.max(...onward.map((t) => t.dep)));
      onward = onward.concat((await ask(shift(last, 1))).filter((t) => t.dep > last));
    }
    const seen = new Set();
    const uniq = (t) => {
      const k = `${t.dep.getTime()}|${t.arr.getTime()}|${t.lines}`;
      return !seen.has(k) && seen.add(k);
    };
    const byDep = (a, b) => a.dep - b.dep;
    const earlier = before.filter((t) => t.dep < x.from).filter(uniq).sort(byDep).slice(-ALT_EARLIER);
    onward = onward.filter(uniq).sort(byDep);
    const upToPlanned = onward.filter((t) => t.dep <= x.to);
    const later = onward.filter((t) => t.dep > x.to).slice(0, ALT_LATER);
    const trips = [...earlier, ...upToPlanned, ...later];
    const nextRide = j.legs.find((l) => l.kind === LegKind.RIDE && l.dep.getTime() === x.to.getTime());
    const key = (l) => l && `${l.line}@${l.dep.getTime()}`;
    return trips.map((t) => {
      const first = t.legs.find((l) => l.kind === LegKind.RIDE);
      let rel = AltRel.LATER;
      if (key(first) === key(nextRide)) {
        rel = AltRel.PLANNED;
      } else if (t.dep < x.from) {
        rel = AltRel.EARLIER;
      }
      return { trip: t, rel, delta: minutesBetween(j.transitEnd, t.arr) };
    });
  }

  // New search from a transfer stop, from my planned arrival there on.
  //   toHome:           Nach Hause from the stop
  //   fromHome / other: Anderer Ort, stop → the journey's destination
  function followUpSearch(j, x) {
    if (j.dir === Direction.TO_HOME) {
      return { dir: Direction.TO_HOME, place: x.stop, origin: "", at: x.from, timeRef: TimeRef.DEPART };
    }
    return { dir: Direction.OTHER, origin: x.stop, place: j.query.to, at: x.from, timeRef: TimeRef.DEPART };
  }

  // Entry point of the form. Ab also fetches what left up to
  // RECENT_PAST_MIN ago; `at` stays the asked time (for the "vor N Min." tag).
  async function search(place, at, dir, timeRef, origin) {
    const lookback = timeRef === TimeRef.DEPART ? RECENT_PAST_MIN : 0;
    const r = await plan(place, shift(at, -lookback), dir, timeRef, origin);
    const hi = timeRef === TimeRef.DEPART ? shift(at, MIN_WINDOW_MIN) : r.hi;
    return { ...r, at, hi, params: { place, dir, timeRef, origin } };
  }

  // "Frühere" / "Spätere": fetch the next MORE_STEP_MIN outside the window,
  // merge, widen the window.
  //   Ab: earlier = depart from lo − step; later = depart from hi
  //   An: earlier = arrive by lo;          later = arrive by hi + step
  async function extend(result, side) {
    const { place, dir, timeRef, origin } = result.params;
    const earlier = side === "earlier";
    const depart = timeRef === TimeRef.DEPART;
    const lo = earlier ? shift(result.lo, -MORE_STEP_MIN) : result.lo;
    const hi = earlier ? result.hi : shift(result.hi, MORE_STEP_MIN);
    let q;
    if (depart) {
      q = earlier ? lo : result.hi;
    } else {
      q = earlier ? result.lo : hi;
    }
    const more = await plan(place, q, dir, timeRef, origin);
    return {
      ...result,
      journeys: prune([...result.journeys, ...more.journeys], dir),
      failed: [...new Set([...result.failed, ...more.failed])],
      lo,
      hi,
    };
  }

  return { plan, search, extend, visible, suggest, stopAbbr, alternatives, followUpSearch };
})();

// ---------- Stations: recent + favorites, persisted in localStorage ----------

const Stations = (() => {
  const load = () => {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { recent: [], favorites: [] };
    } catch {
      return { recent: [], favorites: [] };
    }
  };
  const save = (s) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch {
      // Storage unavailable (private mode): keep working without memory.
    }
  };

  // Most recently used first, capped; favorites are never dropped from recent.
  function touch(name) {
    const s = load();
    s.recent = [name, ...s.recent.filter((n) => n !== name)].slice(0, MAX_RECENT);
    save(s);
  }

  function toggleFavorite(name) {
    const s = load();
    const isFav = s.favorites.includes(name);
    s.favorites = isFav ? s.favorites.filter((n) => n !== name) : [...s.favorites, name];
    save(s);
    return !isFav;
  }

  const isFavorite = (name) => load().favorites.includes(name);
  const favorites = () => load().favorites;
  const recent = () => load().recent.filter((n) => !isFavorite(n));

  return { touch, toggleFavorite, isFavorite, favorites, recent };
})();

// ---------- UI ----------

const $ = (id) => document.getElementById(id);
const hhmm = (d) => d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", hour12: false });
const minutes = (a, b) => Math.round((b - a) / MS_PER_MIN);

function initInputs() {
  const now = new Date();
  $("date").valueAsDate = new Date(now.getTime() - now.getTimezoneOffset() * MS_PER_MIN);
  $("time").value = hhmm(now);
}

// Duration color: share of --bad on the scale best → worst duration.
function durColor(min, best, worst) {
  const p = worst > best ? Math.round(((min - best) / (worst - best)) * 100) : 0;
  return `color-mix(in oklab, var(--bad) ${p}%, var(--good))`;
}

// Positions a bar segment on the shared time axis [t0, t1].
function segment(cls, from, to, t0, t1) {
  const span = document.createElement("span");
  const total = t1 - t0 || 1;
  span.className = cls;
  span.style.left = `${((from - t0) / total) * 100}%`;
  span.style.width = `${((to - from) / total) * 100}%`;
  return span;
}

// Segment with text candidates (longest first); fitLabels() picks one.
function labelled(cls, from, to, t0, t1, texts, title) {
  const span = segment(`${cls} lbl`, from, to, t0, t1);
  span.dataset.texts = JSON.stringify(texts);
  span.title = title;
  return span;
}

// Bubble above the bar for a stop. `align`: where the tip sits (see CSS).
// Text is chosen by fitPins(): full name if there is room, else abbreviation.
function stopPin(name, at, align, t0, t1) {
  const pin = document.createElement("span");
  pin.className = `pin ${align}`;
  pin.style.left = `${((at - t0) / (t1 - t0 || 1)) * 100}%`;
  pin.dataset.texts = JSON.stringify([...new Set([name, Planner.stopAbbr(name)])]);
  pin.title = name;
  return pin;
}

const PIN_GAP_PX = 3;

// Per bar: longest text form that lets no two bubbles overlap, same form for
// all bubbles of the bar so they read consistently. Zooming in gives room.
function fitPins(root) {
  root.querySelectorAll(".bar").forEach((bar) => {
    const pins = [...bar.querySelectorAll(".pin")];
    if (!pins.length) {
      return;
    }
    const forms = pins.map((p) => JSON.parse(p.dataset.texts));
    const levels = Math.max(...forms.map((f) => f.length));
    for (let lvl = 0; lvl < levels; lvl++) {
      pins.forEach((p, i) => {
        p.textContent = forms[i][Math.min(lvl, forms[i].length - 1)];
      });
      const rects = pins.map((p) => p.getBoundingClientRect()).sort((a, b) => a.left - b.left);
      const overlap = rects.some((r, i) => i > 0 && rects[i - 1].right + PIN_GAP_PX > r.left);
      if (!overlap) {
        return;
      }
    }
  });
}

// Must run once the bar is laid out: first text that fits, else none.
function fitLabels(root) {
  root.querySelectorAll(".lbl").forEach((el) => {
    const texts = JSON.parse(el.dataset.texts || "[]");
    el.textContent = "";
    for (const t of texts) {
      el.textContent = t;
      if (el.scrollWidth <= el.clientWidth) {
        return;
      }
    }
    el.textContent = "";
  });
  fitPins(root);
}

function renderJourney(j, t0, t1, scale, past) {
  const li = document.createElement("li");
  li.dataset.startFrac = String((j.start - t0) / (t1 - t0 || 1));
  li.dataset.endFrac = String((j.end - t0) / (t1 - t0 || 1));

  const times = document.createElement("div");
  times.className = "times";
  const tt = document.createElement("span");
  tt.className = "tt";
  tt.textContent = `${hhmm(j.start)} – ${hhmm(j.end)}`;
  times.append(tt);
  const dur = document.createElement("span");
  dur.className = "dur";
  const durMin = minutes(j.start, j.end);
  dur.textContent = `${durMin} Min.`;
  dur.style.background = durColor(durMin, scale.best, scale.worst);
  if (past) {
    const tag = document.createElement("span");
    tag.className = "past-tag";
    tag.textContent = past;
    tag.title = "Schon losgegangen: lohnt es sich zu rennen?";
    times.append(tag);
  }
  times.append(dur);
  // Tag + duration pushed to the right edge of the card.
  (times.querySelector(".past-tag") || dur).classList.add("push");

  const track = document.createElement("div");
  track.className = "track";
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.setAttribute("aria-hidden", "true");
  track.append(bar);
  // Home walk, a wait track under the whole transit span, gray transfer blocks,
  // then each API leg (ride = solid blue with line, walk = dotted; short change
  // walks are covered by the transfer block), then bubbles: start, transfers, end.
  const walkFrom = j.walkFirst ? j.start : j.transitEnd;
  const walkTo = j.walkFirst ? j.transitStart : j.end;
  const legSeg = (l) => {
    if (l.kind === LegKind.RIDE) {
      return labelled("transit", l.dep, l.arr, t0, t1, [l.line], `${l.line} → ${l.headsign}`);
    }
    return l.kind === LegKind.WALK ? segment("walk", l.dep, l.arr, t0, t1) : null;
  };
  bar.append(
    segment("walk", walkFrom, walkTo, t0, t1),
    segment("wait", j.transitStart, j.transitEnd, t0, t1),
    ...j.transfers.map((x) => segment("xfer", x.from, x.to, t0, t1)),
    ...(j.legs.length
      ? j.legs.map(legSeg).filter(Boolean)
      : [labelled("transit", j.transitStart, j.transitEnd, t0, t1, [j.lines], j.lines)]),
    stopPin(j.from, j.transitStart, "start", t0, t1),
    ...j.transfers.map((x) =>
      stopPin(x.stop, new Date((x.from.getTime() + x.to.getTime()) / 2), "", t0, t1)
    ),
    stopPin(j.to, j.transitEnd, "end", t0, t1)
  );

  const meta = document.createElement("div");
  meta.className = "meta";
  const extra = j.hasExtraWalk ? " · + Fussweg" : "";
  meta.textContent = `${j.stop} · ${j.lines}${extra}`;

  li.append(times, track, meta);

  if (j.transfers.length) {
    const xfer = document.createElement("div");
    xfer.className = "meta";
    xfer.textContent = `Umsteigen: ${j.transfers.map((x) => x.stop).join(", ")}`;
    li.append(xfer);
  }

  // Click toggles the leg-by-leg detail.
  const details = renderDetails(j);
  details.hidden = true;
  li.append(details);
  li.classList.add("clickable");
  li.addEventListener("click", () => {
    details.hidden = !details.hidden;
  });

  return li;
}

// Leg table plus the API query, so a strange result can be traced back.
function renderDetails(j) {
  const box = document.createElement("div");
  box.className = "details";

  const legs = document.createElement("table");
  legs.className = "legs";
  legRows(j).forEach((r) => legs.append(legRow(r)));

  const q = document.createElement("div");
  q.className = "meta";
  const ref = j.query.timeRef === TimeRef.ARRIVE ? "an" : "ab";
  const feeder = j.query.feeder ? ` + Zubringer ${j.query.feeder}` : "";
  q.textContent = `Abfrage: ${j.query.from} → ${j.query.to}, ${ref} ${hhmm(j.query.at)}${feeder}`;

  box.addEventListener("click", (e) => e.stopPropagation());
  box.append(legs);
  j.transfers.forEach((x) => box.append(altButton(j, x)));
  box.append(q);
  return box;
}

// Rows of the leg table, incl. our own home walk at the home end.
function legRows(j) {
  const api = j.legs.map((l) => ({ ...l, walkMin: Math.round(l.walkSec / 60) }));
  if (!j.homeEnd) {
    return api;
  }
  const homeWalk = {
    kind: LegKind.WALK,
    walkMin: j.walkMin,
    from: j.walkFirst ? "Zuhause" : j.stop,
    to: j.walkFirst ? j.stop : "Zuhause",
    dep: j.walkFirst ? j.start : j.transitEnd,
    arr: j.walkFirst ? j.transitStart : j.end,
  };
  return j.walkFirst ? [homeWalk, ...api] : [...api, homeWalk];
}

function cell(cls, text) {
  const td = document.createElement("td");
  td.className = cls;
  td.textContent = text;
  return td;
}

// One leg: rides show line + shortened direction (tap for full name);
// walks show "Fuss"/"Umst." and the minutes.
function legRow(l) {
  const tr = document.createElement("tr");
  tr.className = l.kind;
  const ride = l.kind === LegKind.RIDE;

  const from = cell("stop", l.from);
  if (ride && l.platform) {
    const gl = document.createElement("span");
    gl.className = "gl";
    gl.textContent = `Gleis/Kante ${l.platform}`;
    from.append(gl);
  }

  const ln = document.createElement("td");
  ln.className = "ln";
  const badge = document.createElement("b");
  badge.textContent = ride ? l.line : l.kind === LegKind.WALK ? "Fuss" : "Umst.";
  ln.append(badge);

  const dir = cell("dir", ride ? `→ ${Planner.stopAbbr(l.headsign)}` : `${l.walkMin} Min.`);
  if (ride) {
    dir.title = l.headsign;
    dir.addEventListener("click", () => {
      const open = dir.classList.toggle("open");
      dir.textContent = `→ ${open ? l.headsign : Planner.stopAbbr(l.headsign)}`;
    });
  }

  tr.append(cell("tm", hhmm(l.dep)), from, ln, dir, cell("stop", l.to), cell("tm end", hhmm(l.arr)));
  return tr;
}

// Button per transfer; loads and toggles the alternatives below it.
function altButton(j, x) {
  const wrap = document.createElement("div");
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "alt-btn";
  btn.textContent = "Alternativen";
  btn.title = `Alternativen ab ${x.stop}`;
  const panel = document.createElement("div");
  panel.hidden = true;
  let loaded = false;

  btn.addEventListener("click", async () => {
    panel.hidden = !panel.hidden;
    if (loaded || panel.hidden) {
      return;
    }
    loaded = true;
    panel.className = "alts";
    panel.textContent = "Suche …";
    try {
      renderAlternatives(panel, j, x, await Planner.alternatives(j, x));
    } catch (err) {
      loaded = false;
      panel.textContent = `Fehler: ${err.message}`;
    }
  });

  // Right: same parameters as a fresh search, results replace the list.
  const again = document.createElement("button");
  again.type = "button";
  again.className = "alt-btn";
  again.textContent = "Neue Suche";
  again.title = `Neue Suche ab ${x.stop}`;
  again.addEventListener("click", () => startSearch(Planner.followUpSearch(j, x)));

  const btns = document.createElement("div");
  btns.className = "alt-btns";
  const label = document.createElement("span");
  label.className = "at";
  label.textContent = `Ab ${x.stop}:`;
  btns.append(label, btn, again);
  wrap.append(btns, panel);
  return wrap;
}

// Legs of one alternative + changes and how it compares at the destination.
function renderAltDetail(a, j) {
  const box = document.createElement("div");
  box.className = "alt-detail";
  const table = document.createElement("table");
  table.className = "legs";
  a.trip.legs.forEach((l) => table.append(legRow({ ...l, walkMin: Math.round(l.walkSec / 60) })));

  const n = a.trip.transfers.length;
  const changes = n === 0 ? "direkt" : `${n}× umsteigen`;
  const delta = a.delta === 0 ? "wie geplant" : a.delta > 0 ? `${a.delta} Min. später als geplant` : `${-a.delta} Min. früher als geplant`;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${changes} · an ${j.to} ${hhmm(a.trip.arr)}, ${delta}`;
  box.append(table, meta);
  return box;
}

const ALT_REL_TEXT = {
  [AltRel.EARLIER]: "falls verspätet",
  [AltRel.PLANNED]: "geplant",
  [AltRel.LATER]: "verpasst",
};

// Mini timelines on a common axis; dashed line = my planned arrival at the
// transfer stop. Left of it: only reachable if that one is late.
function renderAlternatives(panel, j, x, alts) {
  panel.replaceChildren();
  const head = document.createElement("h4");
  head.textContent = `Ab ${x.stop} nach ${j.to} · an ${hhmm(x.from)}`;
  panel.append(head);

  if (!alts.length) {
    panel.append("Keine Verbindungen gefunden.");
    return;
  }

  const t0 = Math.min(x.from, ...alts.map((a) => a.trip.dep));
  const t1 = Math.max(...alts.map((a) => a.trip.arr));
  const axis = document.createElement("div");
  axis.className = "axis";

  alts.forEach((a) => {
    const row = document.createElement("div");
    row.className = `alt-row ${a.rel}`;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = `${hhmm(a.trip.dep)} – ${hhmm(a.trip.arr)}`;
    const bar = document.createElement("div");
    bar.className = "bar mini";
    a.trip.legs.forEach((l) => {
      if (l.kind === LegKind.RIDE) {
        bar.append(labelled("transit", l.dep, l.arr, t0, t1, [l.line], `${l.line} → ${l.headsign}`));
      } else if (l.kind === LegKind.WALK) {
        bar.append(segment("walk", l.dep, l.arr, t0, t1));
      }
    });
    if (!a.trip.legs.length) {
      bar.append(segment("transit", a.trip.dep, a.trip.arr, t0, t1));
    }
    const d = document.createElement("span");
    d.className = "d";
    const delta = a.delta === 0 ? "±0" : a.delta > 0 ? `+${a.delta}` : `−${-a.delta}`;
    d.textContent = a.rel === AltRel.PLANNED ? ALT_REL_TEXT[a.rel] : `${delta} Min.`;
    d.title = ALT_REL_TEXT[a.rel];
    bar.append(segment("now", x.from, x.from, t0, t1));
    row.append(t, bar, d);

    // Tap a row: its legs as table, like the connection details.
    const detail = renderAltDetail(a, j);
    detail.hidden = true;
    row.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      row.classList.toggle("open", !detail.hidden);
    });
    axis.append(row, detail);
  });

  panel.append(axis);
  requestAnimationFrame(() => fitLabels(panel));

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "Gestrichelt: geplante Ankunft hier. Blass: fährt vorher, nur erreichbar bei Verspätung. ± = Ankunft am Ziel gegenüber geplant.";
  panel.append(legend);
}

// ---------- Place suggestions (one widget per field: Ort/Nach, Von) ----------

function placeField(inputId, listId) {
  const input = () => $(inputId);
  const list = () => $(listId);
  let timer = null;
  let seq = 0;

  function item(name) {
    const li = document.createElement("li");
    li.setAttribute("role", "option");

    const label = document.createElement("span");
    label.className = "name";
    label.textContent = name;

    const star = document.createElement("button");
    star.type = "button";
    star.className = Stations.isFavorite(name) ? "star on" : "star";
    star.textContent = "★";
    star.setAttribute("aria-label", "Favorit");
    star.addEventListener("click", (e) => {
      e.stopPropagation();
      star.classList.toggle("on", Stations.toggleFavorite(name));
    });

    li.append(label, star);
    li.addEventListener("click", () => {
      input().value = name;
      close();
    });
    return li;
  }

  function group(text) {
    const li = document.createElement("li");
    li.className = "group";
    li.textContent = text;
    return li;
  }

  // Also cancels a pending lookup, so it can't pop up after a search started.
  function close() {
    clearTimeout(timer);
    ++seq;
    list().replaceChildren();
    input().setAttribute("aria-expanded", "false");
  }

  function show(names, grouped) {
    const l = list();
    l.replaceChildren();
    if (grouped) {
      const favs = Stations.favorites();
      const recent = Stations.recent();
      if (favs.length) {
        l.append(group("Favoriten"), ...favs.map(item));
      }
      if (recent.length) {
        l.append(group("Zuletzt"), ...recent.map(item));
      }
    } else {
      l.append(...names.map(item));
    }
    input().setAttribute("aria-expanded", l.children.length ? "true" : "false");
  }

  // Empty field: favorites + recent. Otherwise: debounced lookup, stale replies dropped.
  function onInput() {
    clearTimeout(timer);
    const query = input().value.trim();
    const s = ++seq;
    if (!query) {
      show([], true);
      return;
    }
    timer = setTimeout(async () => {
      const known = [...Stations.favorites(), ...Stations.recent()];
      try {
        const names = await Planner.suggest(query, known);
        if (s === seq) {
          show(names, false);
        }
      } catch {
        close();
      }
    }, DEBOUNCE_MS);
  }

  // Tap on the field: favorites + recent, not hits for the current text.
  // Text is selected, so typing replaces it.
  function onFocus() {
    clearTimeout(timer);
    ++seq;
    show([], true);
    input().select();
  }

  function init() {
    input().addEventListener("input", onInput);
    input().addEventListener("focus", onFocus);
  }

  return { init, close };
}

const placeFields = [placeField("place", "sugg"), placeField("origin", "origin-sugg")];
const closeSuggestions = () => placeFields.forEach((f) => f.close());

function durationScale(journeys) {
  const mins = journeys.map((j) => minutes(j.start, j.end));
  return { best: Math.min(...mins), worst: Math.max(...mins) };
}

// Top line: fastest and slowest door-to-door duration of the shown journeys.
function renderSummary(journeys) {
  const box = $("summary");
  box.replaceChildren();
  if (!journeys.length) {
    return;
  }
  const { best, worst } = durationScale(journeys);
  const item = (label, min) => {
    const span = document.createElement("span");
    span.className = "item";
    const pill = document.createElement("span");
    pill.className = "dur";
    pill.textContent = `${min} Min.`;
    pill.style.background = durColor(min, best, worst);
    span.append(label, pill);
    return span;
  };
  box.append(item("Schnellste", best), item("Langsamste", worst));
}

// Last search result; the walk toggle filters it without searching again.
let lastResult = null;

const walkMode = () => ($("walk").checked ? WalkMode.SHOW : WalkMode.HIDE);

// "vor 3 Min." if the asked time is now, else "3 Min. früher"; null if not past.
function pastLabel(j) {
  const r = lastResult;
  if (!r || r.timeRef !== TimeRef.DEPART || j.start >= r.at) {
    return null;
  }
  const n = minutes(j.start, r.at);
  if (n > RECENT_PAST_MIN) {
    return null; // fetched with "Frühere": just earlier, not a run candidate
  }
  const asked = Math.abs(Date.now() - r.at) < 2 * MS_PER_MIN;
  return asked ? `vor ${n} Min.` : `${n} Min. früher`;
}

function render() {
  const list = $("results");
  list.replaceChildren();
  $("summary").replaceChildren();
  $("earlier").hidden = !lastResult;
  $("later").hidden = !lastResult;
  if (!lastResult) {
    return;
  }

  const { failed } = lastResult;
  const journeys = Planner.visible(lastResult, walkMode());

  renderSummary(journeys);
  const status = $("status");
  status.className = failed.length ? "error" : "";
  status.textContent = failed.length ? `Keine Daten für: ${failed.join(", ")}` : "";

  if (!journeys.length) {
    status.textContent ||= "Keine Verbindungen gefunden. Ort oder Zeit anpassen.";
    return;
  }

  const t0 = Math.min(...journeys.map((j) => j.start));
  const t1 = Math.max(...journeys.map((j) => j.end));
  const scale = durationScale(journeys);
  journeys.forEach((j) => {
    const li = renderJourney(j, t0, t1, scale, pastLabel(j));
    li.classList.toggle("past", Boolean(pastLabel(j)));
    list.append(li);
  });
  const avg = journeys.reduce((sum, j) => sum + (j.end - j.start), 0) / journeys.length;
  Timeline.fit(list, t1 - t0, avg);
  fitLabels(list);
}

// ---------- Timeline zoom: pinch / Ctrl+wheel widens all bars, swipe scrolls ----------

const ZOOM_MIN = 1;
const ZOOM_MAX = 12;
// Start zoom: a journey of average duration fills this share of the card width
// (longer ones run past the edge; swipe or zoom out).
const BAR_FILL = 0.8;
const WHEEL_ZOOM_STEP = 1.1;
const FOLLOW_MARGIN_PX = 8;

const Timeline = (() => {
  let zoom = ZOOM_MIN;
  let scrollFrac = 0; // left edge as share of the bar width, kept across re-renders
  let syncing = false;
  let fitQueued = false;

  const root = () => $("results");
  const tracks = () => [...root().querySelectorAll(".track")];
  const clamp = (z) => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));

  function scrollAll(left, except) {
    syncing = true;
    tracks().forEach((t) => {
      if (t !== except) {
        t.scrollLeft = left;
      }
    });
    requestAnimationFrame(() => {
      syncing = false;
    });
  }

  function queueFit() {
    if (fitQueued) {
      return;
    }
    fitQueued = true;
    requestAnimationFrame(() => {
      fitQueued = false;
      fitLabels(root());
    });
  }

  // Zooms so the time under screen x `clientX` stays under it.
  let userZoomed = false;

  // Zoom keeps a focus point (share of the bar width) at the same x on the
  // track, so the content there doesn't drift away.
  function zoomAt(newZoom, track, focus) {
    userZoomed = true;
    zoom = clamp(newZoom);
    root().style.setProperty("--zoom", String(zoom));
    track.scrollLeft = focus.frac * track.scrollWidth - focus.x;
    scrollAll(track.scrollLeft, track);
    scrollFrac = track.scrollLeft / track.scrollWidth;
    queueFit();
  }

  // Focus = middle of the journey of the card under the fingers/mouse, kept
  // where it is on screen; if that middle is off screen, it's brought to the
  // centre. No card (between cards): the point under the fingers.
  //   before:  |   [===J===]   |      after zoom:  | [=====J=====] |
  //                    ^ mid stays here                   ^
  function focusFor(track, target, clientX) {
    const box = track.getBoundingClientRect();
    const li = target.closest?.("#results > li");
    if (!li) {
      const x = clientX - box.left;
      return { frac: (track.scrollLeft + x) / track.scrollWidth, x };
    }
    const frac = (Number(li.dataset.startFrac) + Number(li.dataset.endFrac)) / 2;
    let x = frac * track.scrollWidth - track.scrollLeft;
    if (x < 0 || x > box.width) {
      x = box.width / 2;
    }
    return { frac, x };
  }

  // After a render: user zoom kept; otherwise zoom so an average journey
  // fills BAR_FILL of the width, scrolled to the first connections on screen.
  // All bars still share one time axis, so they stay comparable.
  function fit(list, span, average) {
    if (userZoomed) {
      restore(list);
      return;
    }
    zoom = clamp((BAR_FILL * span) / (average || span || 1));
    list.style.setProperty("--zoom", String(zoom));
    followNow();
  }

  // New search: back to automatic zoom.
  function reset() {
    userZoomed = false;
    scrollFrac = 0;
  }

  // After a re-render: same zoom and position as before.
  function restore(list) {
    list.style.setProperty("--zoom", String(zoom));
    const first = list.querySelector(".track");
    if (first) {
      scrollAll(scrollFrac * first.scrollWidth);
    }
  }

  function onScroll(e) {
    const t = e.target;
    if (!(t instanceof Element) || !t.classList.contains("track") || syncing) {
      return;
    }
    scrollFrac = t.scrollLeft / t.scrollWidth;
    scrollAll(t.scrollLeft, t);
  }

  let pinch = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

  // Track used as geometry reference for a gesture anywhere in the list:
  // the bar of the card under the finger, else the first one.
  const trackAt = (target) =>
    target.closest?.(".track") || target.closest?.("#results > li")?.querySelector(".track") || root().querySelector(".track");

  // One-finger swipe outside a bar: horizontal → scroll all bars; vertical →
  // page scrolls natively (#results has touch-action: pan-y). On a bar the
  // native horizontal scroll does it.
  let swipe = null;
  const SWIPE_LOCK_PX = 8;

  function onTouchStart(e) {
    const track = trackAt(e.target);
    if (!track) {
      return;
    }
    if (e.touches.length === 2) {
      swipe = null;
      const mid = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinch = { d: dist(e.touches[0], e.touches[1]), zoom, track, focus: focusFor(track, e.target, mid) };
    } else if (e.touches.length === 1 && !e.target.closest(".track")) {
      const t = e.touches[0];
      swipe = { x: t.clientX, y: t.clientY, left: track.scrollLeft, lock: null };
    }
  }

  function onTouchMove(e) {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const [a, b] = e.touches;
      zoomAt(pinch.zoom * (dist(a, b) / pinch.d), pinch.track, pinch.focus);
      return;
    }
    if (!swipe || e.touches.length !== 1) {
      return;
    }
    const dx = e.touches[0].clientX - swipe.x;
    const dy = e.touches[0].clientY - swipe.y;
    if (!swipe.lock && Math.max(Math.abs(dx), Math.abs(dy)) > SWIPE_LOCK_PX) {
      swipe.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (swipe.lock === "x") {
      e.preventDefault();
      scrollAll(swipe.left - dx);
      const first = root().querySelector(".track");
      scrollFrac = first ? first.scrollLeft / first.scrollWidth : 0;
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) {
      pinch = null;
    }
    if (!e.touches.length) {
      swipe = null;
    }
  }

  // Desktop, anywhere in the list: Ctrl+wheel (also trackpad pinch) zooms;
  // Shift+wheel or sideways wheel scrolls the bars (on a bar natively).
  function onWheel(e) {
    const track = trackAt(e.target);
    if (!track) {
      return;
    }
    if (e.ctrlKey) {
      e.preventDefault();
      zoomAt(zoom * (e.deltaY < 0 ? WHEEL_ZOOM_STEP : 1 / WHEEL_ZOOM_STEP), track, focusFor(track, e.target, e.clientX));
      return;
    }
    const sideways = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (sideways && !e.target.closest(".track")) {
      e.preventDefault();
      scrollAll(track.scrollLeft + (e.deltaX || e.deltaY));
      scrollFrac = track.scrollLeft / track.scrollWidth;
    }
  }

  // Vertical scroll: move the timeline so the topmost card's start sits at
  // the left edge (see followNow).
  let followQueued = false;
  function followViewport() {
    if (zoom <= ZOOM_MIN || pinch || swipe?.lock === "x" || followQueued) {
      return;
    }
    followQueued = true;
    requestAnimationFrame(() => {
      followQueued = false;
      followNow();
    });
  }

  // Anchor = topmost card still at least half on screen; its start goes to
  // the left edge, cards below run on to the right. (Earlier: the earliest of
  // all cards on screen, which barely moved once several were visible.)
  function followNow() {
    const first = root().querySelector(".track");
    const cards = [...root().children];
    if (!first || !cards.length) {
      return;
    }
    const anchor = cards.find((li) => {
      const r = li.getBoundingClientRect();
      return r.top + r.height / 2 >= 0;
    }) || cards[cards.length - 1];
    const frac = Number(anchor.dataset.startFrac);
    scrollAll(Math.max(0, frac * first.scrollWidth - FOLLOW_MARGIN_PX));
    scrollFrac = first.scrollLeft / first.scrollWidth;
  }

  function init() {
    const r = root();
    window.addEventListener("scroll", followViewport, { passive: true });
    r.addEventListener("scroll", onScroll, true); // scroll doesn't bubble
    r.addEventListener("touchstart", onTouchStart, { passive: true });
    r.addEventListener("touchmove", onTouchMove, { passive: false });
    r.addEventListener("touchend", onTouchEnd);
    r.addEventListener("touchcancel", onTouchEnd);
    r.addEventListener("wheel", onWheel, { passive: false });
    // iOS Safari: block page zoom while pinching the timeline.
    r.addEventListener("gesturestart", (e) => e.preventDefault());
  }

  return { init, restore, fit, reset };
})();

async function onSubmit(e) {
  e.preventDefault();

  const place = $("place").value.trim();
  const origin = $("origin").value.trim();
  const dir = document.querySelector("input[name=dir]:checked").value;
  if (!place || (dir === Direction.OTHER && !origin)) {
    return;
  }

  closeSuggestions();
  if (dir === Direction.OTHER) {
    Stations.touch(origin);
  }
  Stations.touch(place);

  const at = new Date(`${$("date").value}T${$("time").value}`);
  const timeRef = document.querySelector("input[name=ref]:checked").value;
  $("status").className = "";
  $("status").textContent = "Suche …";
  lastResult = null;
  render();

  try {
    lastResult = await Planner.search(place, at, dir, timeRef, origin);
    Timeline.reset();
    render();
  } catch (err) {
    $("status").className = "error";
    $("status").textContent = `Fehler: ${err.message}`;
  }
}

// Anderer Ort shows the "Von" field and turns "Ort" into "Nach".
function onDirChange() {
  const other = document.querySelector("input[name=dir]:checked").value === Direction.OTHER;
  $("origin-row").hidden = !other;
  $("origin").required = other;
  $("place").placeholder = other ? "Nach, z. B. Zürich Flughafen" : "Ort, z. B. Zürich HB";
}

const pad2 = (n) => String(n).padStart(2, "0");

// Fills the form from search parameters and runs it, e.g. "Neue Suche ab …".
function startSearch({ dir, origin, place, at, timeRef }) {
  document.querySelector(`input[name=dir][value="${dir}"]`).checked = true;
  document.querySelector(`input[name=ref][value="${timeRef}"]`).checked = true;
  onDirChange();
  $("origin").value = origin || "";
  $("place").value = place;
  $("date").value = `${at.getFullYear()}-${pad2(at.getMonth() + 1)}-${pad2(at.getDate())}`;
  $("time").value = hhmm(at);
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("form").requestSubmit();
}

// Frühere / Spätere: widen the current result, keep the list in place.
async function onMore(side) {
  const btn = $(side);
  if (!lastResult || btn.disabled) {
    return;
  }
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Lädt …";
  try {
    lastResult = await Planner.extend(lastResult, side);
    render();
  } catch (err) {
    $("status").className = "error";
    $("status").textContent = `Fehler: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

initInputs();
Timeline.init();
$("earlier").addEventListener("click", () => onMore("earlier"));
$("later").addEventListener("click", () => onMore("later"));
placeFields.forEach((f) => f.init());
document.querySelectorAll("input[name=dir]").forEach((r) => r.addEventListener("change", onDirChange));
$("form").addEventListener("submit", onSubmit);
$("walk").addEventListener("change", render);
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => fitLabels($("results")), DEBOUNCE_MS);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".place")) {
    closeSuggestions();
  }
});
// Close the other field's list when one field gets focus.
document.addEventListener("focusin", (e) => {
  if (e.target.id === "place") {
    placeFields[1].close();
  } else if (e.target.id === "origin") {
    placeFields[0].close();
  }
});
</script>
