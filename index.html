    clearTimeout(timer);
    ++seq;
    list().replaceChildren();
    input().setAttribute("aria-expanded", "false");
  }

  function show(names, grouped) {
    const l = list();
    l.replaceChildren();
    if (grouped) {
      // A name that became a place is listed under Orte only.
      const places = Places.names();
      const notPlace = (n) => !Places.byName(n);
      const favs = Stations.favorites().filter(notPlace);
      const recent = Stations.recent().filter(notPlace);
      if (places.length) {
        l.append(group("Orte"), ...places.map(item));
      }
      if (favs.length) {
        l.append(group("Favoriten"), ...favs.map(item));
      }
      if (recent.length) {
        l.append(group("Zuletzt"), ...recent.map(item));
      }
    } else {
      l.append(...names.map(item));
    }
    input().setAttribute("aria-expanded", l.children.length ? "true" : "false");
  }

  // Empty field: favorites + recent. Otherwise: debounced lookup, stale replies dropped.
  function onInput() {
    clearTimeout(timer);
    const query = input().value.trim();
    const s = ++seq;
    if (!query) {
      show([], true);
      return;
    }
    timer = setTimeout(async () => {
      const known = [...new Set([...Places.names(), ...Stations.favorites(), ...Stations.recent()])];
      try {
        const names = await Planner.suggest(query, known);
        if (s === seq) {
          show(names, false);
        }
      } catch {
        close();
      }
    }, DEBOUNCE_MS);
  }

  // Tap on the field: favorites + recent, not hits for the current text.
  // Text is selected, so typing replaces it.
  function onFocus() {
    clearTimeout(timer);
    ++seq;
    show([], true);
    input().select();
  }

  function init() {
    input().addEventListener("input", onInput);
    input().addEventListener("focus", onFocus);
  }

  return { init, close };
}

// Destinations: the field holds one; "+" moves it to a chip so another
// can be typed. Chips plus the field's text are the destinations.
//   [Zürich HB ×] [Stettbach ×]   ┌ Nach … ┐ [+]
const Destinations = (() => {
  let names = [];

  function render() {
    const box = $("dests");
    box.replaceChildren();
    names.forEach((name) => {
      const chip = document.createElement("span");
      chip.className = "dest";
      chip.append(Places.byName(name) ? `${PLACE_ICON} ${name}` : name);
      const rm = document.createElement("button");
      rm.type = "button";
      rm.className = "rm";
      rm.textContent = "×";
      rm.setAttribute("aria-label", `${name} entfernen`);
      rm.addEventListener("click", () => { remove(name); });
      chip.append(rm);
      box.append(chip);
    });
    $("place").required = names.length === 0;
    markPlaces();
  }

  // "+": field text becomes a chip, field is free for the next one.
  function park() {
    const typed = $("place").value.trim();
    if (typed && !names.includes(typed)) {
      names = [...names, typed];
    }
    $("place").value = "";
    render();
    $("place").focus();
  }

  function remove(name) {
    names = names.filter((n) => n !== name);
    render();
  }

  // Last one in the field, the rest as chips: a single destination is
  // plain text, not a chip.
  function set(list) {
    const uniq = [...new Set(list.filter(Boolean))];
    names = uniq.slice(0, -1);
    $("place").value = uniq[uniq.length - 1] || "";
    render();
  }

  // Chips plus whatever is still typed in the field.
  function all() {
    const typed = $("place").value.trim();
    return typed && !names.includes(typed) ? [...names, typed] : names;
  }

  return { park, set, all, render };
})();

// ---------- Places editor: list, add, edit, delete ----------
//   ⌂ Orte
//   Büro   Zürich Oerlikon 5' · Zürich Seebach 12'   [✎] [×]
//   [Name          ]
//   [Haltestelle   ] [ 5] Min. [×]
//   [+ Haltestelle] [Speichern]
const PlacesEditor = (() => {
  let editing = null; // name of the place being edited, null = new
  let timer = null;

  function stopRow(stop = { name: "", walkMin: "" }) {
    const row = document.createElement("div");
    row.className = "stop-row";
    const name = document.createElement("input");
    name.type = "text";
    name.placeholder = "Haltestelle";
    name.setAttribute("list", "stop-options");
    name.value = stop.name;
    name.addEventListener("input", () => fillOptions(name.value));
    const walk = document.createElement("input");
    walk.type = "number";
    walk.min = "0";
    walk.placeholder = "Min.";
    walk.value = stop.walkMin;
    walk.title = "Gehminuten";
    walk.setAttribute("aria-label", "Gehminuten");
    // Secondary: only shown when its vehicle isn't already in another journey.
    const sec = document.createElement("input");
    sec.type = "checkbox";
    sec.checked = Boolean(stop.secondary);
    sec.title = "Nebenhaltestelle: nur wenn ihr Bus nicht schon über eine andere Haltestelle erreicht wird";
    sec.setAttribute("aria-label", "Nebenhaltestelle");
    const rm = document.createElement("button");
    rm.type = "button";
    rm.className = "rm";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Haltestelle entfernen");
    rm.addEventListener("click", () => row.remove());
    row.append(name, walk, sec, rm);
    return row;
  }

  // Datalist for stop names: API lookup after MIN_QUERY_CHARS, debounced.
  function fillOptions(query) {
    clearTimeout(timer);
    if (query.trim().length < MIN_QUERY_CHARS) {
      return;
    }
    timer = setTimeout(async () => {
      try {
        const names = await Planner.suggest(query.trim(), []);
        const dl = $("stop-options");
        dl.replaceChildren(...names.map((n) => Object.assign(document.createElement("option"), { value: n })));
      } catch {
        // No suggestions; typing still works.
      }
    }, DEBOUNCE_MS);
  }

  function readForm() {
    const stops = [...$("pf-stops").querySelectorAll(".stop-row")].map((r) => {
      const [name, walk, sec] = r.querySelectorAll("input");
      return { name: name.value, walkMin: walk.value, secondary: sec.checked };
    });
    const keepHome = editing !== null && Places.byName(editing)?.home;
    return Places.normalize($("pf-name").value, stops, keepHome);
  }

  function showForm(place) {
    editing = place ? place.name : null;
    $("pf-title").textContent = place ? `${place.name} bearbeiten` : "Neuer Ort";
    $("pf-name").value = place ? place.name : "";
    $("pf-stops").replaceChildren(...(place ? place.stops : [{ name: "", walkMin: "" }]).map(stopRow));
    $("pf-cancel").hidden = !place;
    $("pf-delete").hidden = !place;
    $("pf-error").textContent = "";
  }

  function renderList() {
    const ul = $("places-list");
    ul.replaceChildren();
    Places.all().forEach((p) => {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "pname";
      name.textContent = p.name;
      const stops = document.createElement("span");
      stops.className = "pstops";
      stops.textContent = p.stops.map((s) => `${s.name} ${s.walkMin}'${s.secondary ? " (neben)" : ""}`).join(" · ");
      // ★ marks the default "Von"; click another to move it. Delete lives
      // in the edit form.
      const star = iconButton("★", p.home ? "Standard-Von" : "Als Standard-Von", () => { Places.setHome(p.name); renderList(); });
      star.classList.toggle("on", p.home);
      li.append(star, name, iconButton("✎", "Bearbeiten", () => showForm(p)), stops);
      ul.append(li);
    });
  }

  function onSave() {
    try {
      Places.put(readForm(), editing ?? undefined);
    } catch (err) {
      $("pf-error").textContent = err.message;
      return;
    }
    renderList();
    showForm(null);
  }

  const status = (text, error = false) => {
    $("px-status").textContent = text;
    $("px-status").className = error ? "error" : "meta";
  };

  function onExport() {
    const blob = new Blob([Places.exportJson()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = EXPORT_FILE;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function onLink() {
    const link = Places.toLink(location.href.split("#")[0]);
    try {
      await navigator.clipboard.writeText(link);
      status("Link kopiert.");
    } catch {
      prompt("Link kopieren:", link);
    }
  }

  async function onImport(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) {
      return;
    }
    importText(await file.text());
  }

  function importText(text) {
    try {
      const n = Places.importJson(text);
      renderList();
      status(`${n} Ort${n === 1 ? "" : "e"} importiert.`);
    } catch (err) {
      status(err.message, true);
    }
  }

  // Shows/hides the card; the search form below is dimmed meanwhile.
  function openSettings(open) {
    $("places-panel").hidden = !open;
    $("settings").setAttribute("aria-expanded", String(open));
    document.querySelector("main")?.classList.toggle("settings-open", open);
  }

  // Opened via a share link: import, open the card, drop the fragment.
  function importFromHash() {
    const text = Places.fromHash(location.hash);
    if (text === null) {
      return;
    }
    openSettings(true);
    importText(text);
    history.replaceState(null, "", location.pathname + location.search);
  }

  function init() {
    renderList();
    showForm(null);
    $("px-export").addEventListener("click", onExport);
    $("px-link").addEventListener("click", onLink);
    $("px-import").addEventListener("change", onImport);
    importFromHash();
    $("pf-save").addEventListener("click", onSave);
    // Enter inside the editor saves the place, not the search form.
    $("place-form").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        onSave();
      }
    });
    $("pf-add").addEventListener("click", () => $("pf-stops").append(stopRow()));
    $("pf-cancel").addEventListener("click", () => showForm(null));
    $("pf-delete").addEventListener("click", () => {
      if (editing !== null) {
        Places.remove(editing);
        renderList();
        showForm(null);
      }
    });
    $("settings").addEventListener("click", () => openSettings($("places-panel").hidden));
  }

  return { init };
})();

const placeFields = [placeField("place", "sugg"), placeField("origin", "origin-sugg")];
const closeSuggestions = () => placeFields.forEach((f) => f.close());

function durationScale(journeys) {
  const mins = journeys.map((j) => minutes(j.start, j.end));
  return { best: Math.min(...mins), worst: Math.max(...mins) };
}

// ---------- Caps: trim the slowest / most-changes journeys step by step ----------

const CUT_ICON = "✂";
const RESET_ICON = "↺";
const DURATION_ICON = "⏱";
const WALK_ICON = "🚶";
const LINES_ICON = "🚌";
const CHANGES_ICON = "⇄";
const DURATION_CUT_STEP_MIN = 5;
// Share of journeys kept when jumping straight to the best value.
const KEEP_SHARE = 0.1;

const durationOf = (j) => minutes(j.start, j.end);
const changesOf = (j) => j.transfers.length;

// One cap per measure. cut() lowers the cap by at least the measure's step
// below the current maximum of the shown journeys, landing on an existing
// value, e.g. durations 31 38 41 52, step 5 → 41 (≤ 47). It ends at the
// minimum; reset() lifts the cap.
const Caps = (() => {
  const caps = { [CapKind.DURATION]: null, [CapKind.CHANGES]: null };
  const measure = { [CapKind.DURATION]: durationOf, [CapKind.CHANGES]: changesOf };
  const step = { [CapKind.DURATION]: DURATION_CUT_STEP_MIN, [CapKind.CHANGES]: 1 };

  // `except`: leave that one cap out, to see what it alone hides.
  const apply = (journeys, except = null) =>
    journeys.filter((j) =>
      Object.keys(caps).every((k) => k === except || caps[k] === null || measure[k](j) <= caps[k])
    );

  function nextCap(kind, journeys) {
    const values = [...new Set(journeys.map(measure[kind]))].sort((a, b) => a - b);
    if (values.length < 2) {
      return null;
    }
    const target = values[values.length - 1] - step[kind];
    const below = values.filter((v) => v <= target);
    return below.length ? below[below.length - 1] : values[0];
  }

  // Cap at the N-th smallest value, N = KEEP_SHARE of the shown journeys
  // (at least one): e.g. 12 journeys → 2 kept → cap = 2nd smallest duration.
  function cutToBest(kind, journeys) {
    const sorted = journeys.map(measure[kind]).sort((a, b) => a - b);
    const keep = Math.max(1, Math.ceil(sorted.length * KEEP_SHARE));
    caps[kind] = sorted[keep - 1];
  }

  const canCut = (kind, journeys) => nextCap(kind, journeys) !== null;
  const cut = (kind, journeys) => { caps[kind] = nextCap(kind, journeys) ?? caps[kind]; };
  const reset = (kind) => { caps[kind] = null; };
  const resetAll = () => Object.keys(caps).forEach(reset);
  const active = (kind) => caps[kind] !== null;

  return { apply, canCut, cut, cutToBest, reset, resetAll, active };
})();

// Lines picked in the summary; a journey passes when it rides any of them.
const LineFilter = (() => {
  const picked = new Set();
  const linesOf = (j) => j.legs.filter((l) => l.kind === LegKind.RIDE).map((l) => l.line);

  const apply = (journeys) =>
    picked.size ? journeys.filter((j) => linesOf(j).some((l) => picked.has(l))) : journeys;
  const toggle = (line) => { picked.has(line) ? picked.delete(line) : picked.add(line); };
  const clear = () => picked.clear();
  const active = () => picked.size > 0;
  const has = (line) => picked.has(line);

  // Lines to offer: all ridden in `journeys`, plus picked ones no longer
  // present (so they can be unpicked). Trains first, then natural order.
  function offer(journeys) {
    const all = new Set([...picked, ...journeys.flatMap(linesOf)]);
    const rank = (l) => (/^[A-Z]/.test(l) ? 0 : 1);
    return [...all].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "de", { numeric: true }));
  }

  return { apply, toggle, clear, active, has, offer, linesOf };
})();

function iconButton(icon, title, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "icon-btn";
  btn.textContent = icon;
  btn.title = title;
  btn.setAttribute("aria-label", title);
  btn.addEventListener("click", onClick);
  return btn;
}

// Third summary row: the walk toggle; "3/8" = journeys with an extra walk
// out of all that pass the caps.
//   🚶  Mit zusätzlichem Fussweg (3/8)        [x]
function walkRow(everything) {
  const capped = LineFilter.apply(Caps.apply(everything));
  const n = capped.filter((j) => j.hasExtraWalk).length;
  const icon = document.createElement("span");
  icon.className = "icon";
  icon.textContent = WALK_ICON;
  icon.title = "Zusätzlicher Fussweg";
  const label = document.createElement("label");
  label.className = "range toggle";
  label.append(`Mit zusätzlichem Fussweg (${n}/${capped.length})`);
  const slot = document.createElement("span");
  slot.className = "slot";
  walkBox.hidden = false;
  slot.append(walkBox);
  label.htmlFor = "walk";
  return [icon, label, slot, document.createElement("span")];
}

// Last summary row: collapsed, "Linien" plus how many are picked; expanded,
// one chip per line in the shown journeys, picked chips filled.
// `others` = journeys passing every other filter.
//   🚌  Linien (2 gewählt) ▸                     ↺
//   🚌  [S8] [S19] [62] [787] ▾                  ↺
let linesOpen = false;

function linesRow(others) {
  const icon = document.createElement("span");
  icon.className = "icon";
  icon.textContent = LINES_ICON;
  icon.title = "Linien";

  const chips = document.createElement("span");
  chips.className = "range chips";
  const caret = document.createElement("button");
  caret.type = "button";
  caret.className = "caret";
  caret.textContent = linesOpen ? "▾" : "▸";
  caret.title = linesOpen ? "Linien einklappen" : "Linien anzeigen";
  caret.setAttribute("aria-expanded", String(linesOpen));
  caret.addEventListener("click", () => { linesOpen = !linesOpen; render(); });

  if (!linesOpen) {
    const n = LineFilter.offer(others).filter(LineFilter.has).length;
    const label = document.createElement("span");
    label.className = "jump";
    label.textContent = n ? `Linien (${n} gewählt)` : "Linien";
    label.addEventListener("click", () => { linesOpen = true; render(); });
    chips.append(label, caret);
  }

  linesOpen && LineFilter.offer(others).forEach((line) => {
    const n = others.filter((j) => LineFilter.linesOf(j).includes(line)).length;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = LineFilter.has(line) ? "chip on" : "chip";
    chip.textContent = line;
    chip.title = `${n} Verbindung${n === 1 ? "" : "en"}`;
    chip.setAttribute("aria-pressed", String(LineFilter.has(line)));
    chip.addEventListener("click", () => { LineFilter.toggle(line); render(); });
    chips.append(chip);
  });
  if (linesOpen) {
    chips.append(caret);
  }

  // Reset in the last column, aligned with the other rows' ↺.
  const slot = document.createElement("span");
  slot.className = "slot";
  if (LineFilter.active()) {
    slot.append(iconButton(RESET_ICON, "Filter aufheben", () => { LineFilter.clear(); render(); }));
  }
  return [icon, chips, document.createElement("span"), slot];
}

// Summary grid, one row per measure: icon | range | ✂ ↺ (right-aligned,
// slots kept so nothing jumps when a button appears).
//   ⏱  [31 Min.] – [52 Min.]        ✂  ↺
//   ⇄  0 – 2× umsteigen             ✂
// `all` = journeys before the caps: colors and the "(max. …)" hint keep
// referring to the full range, so a capped list still shows what was cut.
function renderSummary(journeys, all, everything) {
  const box = $("summary");
  box.replaceChildren();
  if (!everything.length) {
    return;
  }
  // Order: duration, changes, walk, lines (collapsed by default).
  const tail = [...walkRow(everything), ...linesRow(Caps.apply(all))];
  if (!journeys.length) {
    box.append(...tail);
    return;
  }
  const scale = durationScale(all);
  const { best, worst } = durationScale(journeys);
  // What each cap alone hides: other filters applied, this one left out.
  const worstButDur = durationScale(LineFilter.apply(Caps.apply(all, CapKind.DURATION))).worst;
  const maxCButChg = Math.max(...LineFilter.apply(Caps.apply(all, CapKind.CHANGES)).map(changesOf));

  const pill = (min) => {
    const p = document.createElement("span");
    p.className = "dur";
    p.textContent = `${min} Min.`;
    p.style.background = durColor(min, scale.best, scale.worst);
    return p;
  };
  // Clickable pills: best jumps straight to the shortest durations
  // (cutToBest), worst cuts one step like the scissors.
  const clickable = (el, title, action) => {
    el.classList.add("jump");
    el.title = title;
    el.setAttribute("role", "button");
    el.addEventListener("click", () => { action(); render(); });
    return el;
  };
  const toBest = (kind) => () => Caps.cutToBest(kind, journeys);
  const cutOne = (kind) => () => Caps.cut(kind, journeys);
  const bestPill = (min) => clickable(pill(min), "Nur die kürzesten zeigen", toBest(CapKind.DURATION));
  const worstPill = (min) => clickable(pill(min), "Längste weglassen", cutOne(CapKind.DURATION));
  const text = (t) => {
    const s = document.createElement("span");
    s.textContent = t;
    return s;
  };
  const range = (lo, hi) => (lo === hi ? [lo] : [lo, " – ", hi]);
  const cell = (cls, ...parts) => {
    const span = document.createElement("span");
    span.className = cls;
    span.append(...parts);
    return span;
  };
  const row = (kind, icon, iconTitle, ...parts) => {
    const ic = cell("icon", icon);
    ic.title = iconTitle;
    ic.setAttribute("aria-label", iconTitle);
    const cut = Caps.canCut(kind, journeys)
      ? iconButton(CUT_ICON, "Grösste weglassen", () => { Caps.cut(kind, journeys); render(); })
      : "";
    const reset = Caps.active(kind)
      ? iconButton(RESET_ICON, "Filter aufheben", () => { Caps.reset(kind); render(); })
      : "";
    return [ic, cell("range", ...parts), cell("slot", cut), cell("slot", reset)];
  };

  const changes = journeys.map(changesOf);
  const minC = Math.min(...changes);
  const maxC = Math.max(...changes);
  // Shown when a cap hides the top: "(max. 52 Min.)"; click lifts the cap.
  const hint = (kind, shown, full, unit) =>
    shown < full ? [clickable(text(`(max. ${full}${unit})`), "Filter aufheben", () => Caps.reset(kind))] : [];

  box.append(
    ...row(CapKind.DURATION, DURATION_ICON, "Dauer",
      ...(best === worst ? [pill(best)] : [bestPill(best), " – ", worstPill(worst)]),
      ...hint(CapKind.DURATION, worst, worstButDur, " Min.")),
    ...row(CapKind.CHANGES, CHANGES_ICON, "Umsteigen", ...(minC === maxC
      ? [text(`${minC}× umsteigen`)]
      : [
          clickable(text(String(minC)), "Nur die wenigsten zeigen", toBest(CapKind.CHANGES)),
          " – ",
          clickable(text(String(maxC)), "Meiste weglassen", cutOne(CapKind.CHANGES)),
          "× umsteigen",
        ]),
      ...hint(CapKind.CHANGES, maxC, maxCButChg, "×")),
    ...tail
  );
}

// Last search result; the walk toggle filters it without searching again.
let lastResult = null;

// Held by reference: the box lives inside #summary, which render() rebuilds,
// so it is detached between renders and $("walk") would miss it.
const walkBox = $("walk");
const walkMode = () => (walkBox.checked ? WalkMode.SHOW : WalkMode.HIDE);

// "vor 3 Min." if the asked time is now, else "3 Min. früher"; null if not past.
function pastLabel(j) {
  const r = lastResult;
  if (!r || r.timeRef !== TimeRef.DEPART || j.start >= r.at) {
    return null;
  }
  const n = minutes(j.start, r.at);
  if (n > RECENT_PAST_MIN) {
    return null; // fetched with "Frühere": just earlier, not a run candidate
  }
  const asked = Math.abs(Date.now() - r.at) < 2 * MS_PER_MIN;
  return asked ? `vor ${n} Min.` : `${n} Min. früher`;
}

function render() {
  const list = $("results");
  list.replaceChildren();
  $("summary").replaceChildren();
  $("earlier").hidden = !lastResult;
  $("later").hidden = !lastResult;
  if (!lastResult) {
    return;
  }

  const { failed } = lastResult;
  const everything = Planner.visible(lastResult, WalkMode.SHOW);
  const all = Planner.visible(lastResult, walkMode());
  const journeys = LineFilter.apply(Caps.apply(all));

  renderSummary(journeys, all, everything);
  const status = $("status");
  status.className = failed.length ? "error" : "";
  status.textContent = failed.length ? `Keine Daten für: ${failed.join(", ")}` : "";

  if (!journeys.length) {
    status.textContent ||= "Keine Verbindungen gefunden. Ort oder Zeit anpassen.";
    return;
  }

  const t0 = Math.min(...journeys.map((j) => j.start));
  const t1 = Math.max(...journeys.map((j) => j.end));
  const scale = durationScale(all);
  journeys.forEach((j) => {
    const li = renderJourney(j, t0, t1, scale, pastLabel(j));
    li.classList.toggle("past", Boolean(pastLabel(j)));
    list.append(li);
  });
  const avg = journeys.reduce((sum, j) => sum + (j.end - j.start), 0) / journeys.length;
  Timeline.fit(list, t1 - t0, avg);
  fitLabels(list);
}

// ---------- Timeline zoom: pinch / Ctrl+wheel widens all bars, swipe scrolls ----------

const ZOOM_MIN = 1;
const ZOOM_MAX = 12;
// Start zoom: a journey of average duration fills this share of the card width
// (longer ones run past the edge; swipe or zoom out).
const BAR_FILL = 0.8;
const WHEEL_ZOOM_STEP = 1.1;
const FOLLOW_MARGIN_PX = 8;

const Timeline = (() => {
  let zoom = ZOOM_MIN;
  let scrollFrac = 0; // left edge as share of the bar width, kept across re-renders
  let syncing = false;
  let fitQueued = false;

  const root = () => $("results");
  const tracks = () => [...root().querySelectorAll(".track")];
  const clamp = (z) => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));

  function scrollAll(left, except) {
    syncing = true;
    tracks().forEach((t) => {
      if (t !== except) {
        t.scrollLeft = left;
      }
    });
    requestAnimationFrame(() => {
      syncing = false;
    });
  }

  function queueFit() {
    if (fitQueued) {
      return;
    }
    fitQueued = true;
    requestAnimationFrame(() => {
      fitQueued = false;
      fitLabels(root());
    });
  }

  // Zooms so the time under screen x `clientX` stays under it.
  let userZoomed = false;

  // Zoom keeps a focus point (share of the bar width) at the same x on the
  // track, so the content there doesn't drift away.
  function zoomAt(newZoom, track, focus) {
    userZoomed = true;
    zoom = clamp(newZoom);
    root().style.setProperty("--zoom", String(zoom));
    track.scrollLeft = focus.frac * track.scrollWidth - focus.x;
    scrollAll(track.scrollLeft, track);
    scrollFrac = track.scrollLeft / track.scrollWidth;
    queueFit();
  }

  // Focus = middle of the journey of the card under the fingers/mouse, kept
  // where it is on screen; if that middle is off screen, it's brought to the
  // centre. No card (between cards): the point under the fingers.
  //   before:  |   [===J===]   |      after zoom:  | [=====J=====] |
  //                    ^ mid stays here                   ^
  function focusFor(track, target, clientX) {
    const box = track.getBoundingClientRect();
    const li = target.closest?.("#results > li");
    if (!li) {
      const x = clientX - box.left;
      return { frac: (track.scrollLeft + x) / track.scrollWidth, x };
    }
    const frac = (Number(li.dataset.startFrac) + Number(li.dataset.endFrac)) / 2;
    let x = frac * track.scrollWidth - track.scrollLeft;
    if (x < 0 || x > box.width) {
      x = box.width / 2;
    }
    return { frac, x };
  }

  // After a render: user zoom kept; otherwise zoom so an average journey
  // fills BAR_FILL of the width, scrolled to the first connections on screen.
  // All bars still share one time axis, so they stay comparable.
  function fit(list, span, average) {
    if (userZoomed) {
      restore(list);
      return;
    }
    zoom = clamp((BAR_FILL * span) / (average || span || 1));
    list.style.setProperty("--zoom", String(zoom));
    followNow();
  }

  // New search: back to automatic zoom.
  function reset() {
    userZoomed = false;
    scrollFrac = 0;
  }

  // After a re-render: same zoom and position as before.
  function restore(list) {
    list.style.setProperty("--zoom", String(zoom));
    const first = list.querySelector(".track");
    if (first) {
      scrollAll(scrollFrac * first.scrollWidth);
    }
  }

  function onScroll(e) {
    const t = e.target;
    if (!(t instanceof Element) || !t.classList.contains("track") || syncing) {
      return;
    }
    scrollFrac = t.scrollLeft / t.scrollWidth;
    scrollAll(t.scrollLeft, t);
  }

  let pinch = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

  // Track used as geometry reference for a gesture anywhere in the list:
  // the bar of the card under the finger, else the first one.
  const trackAt = (target) =>
    target.closest?.(".track") || target.closest?.("#results > li")?.querySelector(".track") || root().querySelector(".track");

  // One-finger swipe outside a bar: horizontal → scroll all bars; vertical →
  // page scrolls natively (#results has touch-action: pan-y). On a bar the
  // native horizontal scroll does it.
  let swipe = null;
  const SWIPE_LOCK_PX = 8;

  function onTouchStart(e) {
    const track = trackAt(e.target);
    if (!track) {
      return;
    }
    if (e.touches.length === 2) {
      swipe = null;
      const mid = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinch = { d: dist(e.touches[0], e.touches[1]), zoom, track, focus: focusFor(track, e.target, mid) };
    } else if (e.touches.length === 1 && !e.target.closest(".track")) {
      const t = e.touches[0];
      swipe = { x: t.clientX, y: t.clientY, left: track.scrollLeft, lock: null };
    }
  }

  function onTouchMove(e) {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const [a, b] = e.touches;
      zoomAt(pinch.zoom * (dist(a, b) / pinch.d), pinch.track, pinch.focus);
      return;
    }
    if (!swipe || e.touches.length !== 1) {
      return;
    }
    const dx = e.touches[0].clientX - swipe.x;
    const dy = e.touches[0].clientY - swipe.y;
    if (!swipe.lock && Math.max(Math.abs(dx), Math.abs(dy)) > SWIPE_LOCK_PX) {
      swipe.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (swipe.lock === "x") {
      e.preventDefault();
      scrollAll(swipe.left - dx);
      const first = root().querySelector(".track");
      scrollFrac = first ? first.scrollLeft / first.scrollWidth : 0;
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) {
      pinch = null;
    }
    if (!e.touches.length) {
      swipe = null;
    }
  }

  // Desktop, anywhere in the list: Ctrl+wheel (also trackpad pinch) zooms;
  // Shift+wheel or sideways wheel scrolls the bars (on a bar natively).
  function onWheel(e) {
    const track = trackAt(e.target);
    if (!track) {
      return;
    }
    if (e.ctrlKey) {
      e.preventDefault();
      zoomAt(zoom * (e.deltaY < 0 ? WHEEL_ZOOM_STEP : 1 / WHEEL_ZOOM_STEP), track, focusFor(track, e.target, e.clientX));
      return;
    }
    const sideways = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (sideways && !e.target.closest(".track")) {
      e.preventDefault();
      scrollAll(track.scrollLeft + (e.deltaX || e.deltaY));
      scrollFrac = track.scrollLeft / track.scrollWidth;
    }
  }

  // Vertical scroll: move the timeline so the topmost card's start sits at
  // the left edge (see followNow).
  let followQueued = false;
  function followViewport() {
    if (zoom <= ZOOM_MIN || pinch || swipe?.lock === "x" || followQueued) {
      return;
    }
    followQueued = true;
    requestAnimationFrame(() => {
      followQueued = false;
      followNow();
    });
  }

  // Anchor = topmost card still at least half on screen; its start goes to
  // the left edge, cards below run on to the right. (Earlier: the earliest of
  // all cards on screen, which barely moved once several were visible.)
  function followNow() {
    const first = root().querySelector(".track");
    const cards = [...root().children];
    if (!first || !cards.length) {
      return;
    }
    const anchor = cards.find((li) => {
      const r = li.getBoundingClientRect();
      return r.top + r.height / 2 >= 0;
    }) || cards[cards.length - 1];
    const frac = Number(anchor.dataset.startFrac);
    scrollAll(Math.max(0, frac * first.scrollWidth - FOLLOW_MARGIN_PX));
    scrollFrac = first.scrollLeft / first.scrollWidth;
  }

  function init() {
    const r = root();
    window.addEventListener("scroll", followViewport, { passive: true });
    r.addEventListener("scroll", onScroll, true); // scroll doesn't bubble
    r.addEventListener("touchstart", onTouchStart, { passive: true });
    r.addEventListener("touchmove", onTouchMove, { passive: false });
    r.addEventListener("touchend", onTouchEnd);
    r.addEventListener("touchcancel", onTouchEnd);
    r.addEventListener("wheel", onWheel, { passive: false });
    // iOS Safari: block page zoom while pinching the timeline.
    r.addEventListener("gesturestart", (e) => e.preventDefault());
  }

  return { init, restore, fit, reset };
})();

async function onSubmit(e) {
  e.preventDefault();

  const places = Destinations.all();
  const origin = $("origin").value.trim();
  if (!places.length || !origin) {
    return;
  }

  closeSuggestions();
  Destinations.set(places);
  // Recent list: stations only; custom places are listed anyway.
  [origin, ...places].filter((n) => !Places.byName(n)).forEach(Stations.touch);

  const at = new Date(`${$("date").value}T${$("time").value}`);
  const timeRef = document.querySelector("input[name=ref]:checked").value;
  $("status").className = "";
  $("status").textContent = "Suche …";
  lastResult = null;
  Caps.resetAll();
  LineFilter.clear();
  linesOpen = false;
  render();

  try {
    const from = Places.resolve(origin);
    const pairs = places.map((p) => [from, Places.resolve(p)]);
    lastResult = await Planner.searchPairs(pairs, at, timeRef);
    Timeline.reset();
    render();
  } catch (err) {
    $("status").className = "error";
    $("status").textContent = `Fehler: ${err.message}`;
  }
}

// ⌂ inside Von/Nach when the text is a known place.
function markPlaces() {
  ["origin", "place"].forEach((id) => {
    const input = $(id);
    const box = input.closest?.(".place");
    box?.classList.toggle("known", Boolean(Places.byName(input.value.trim())));
    box?.classList.toggle("filled", input.value !== "");
  });
}

// ×: empties the field and opens its list (places, favorites, recent).
function onClear(e) {
  const input = $(e.currentTarget.dataset.for);
  input.value = "";
  markPlaces();
  input.focus();
}

// Jetzt: today, current time. Does not search.
function onNow() {
  const now = new Date();
  $("date").value = localDateValue(now);
  $("time").value = hhmm(now);
  showDate();
}

// ⇅: Von ↔ first Nach. Further destinations are dropped (one Von only).
function onSwap() {
  const dests = Destinations.all();
  const origin = $("origin").value.trim();
  $("origin").value = dests[0] || "";
  Destinations.set(origin ? [origin] : []);
  markPlaces();
}

const pad2 = (n) => String(n).padStart(2, "0");

// Fills the form from search parameters and runs it, e.g. "Neue Suche ab …".
function startSearch({ from, to, at, timeRef }) {
  document.querySelector(`input[name=ref][value="${timeRef}"]`).checked = true;
  $("origin").value = from;
  Destinations.set([to]);
  markPlaces();
  $("date").value = `${at.getFullYear()}-${pad2(at.getMonth() + 1)}-${pad2(at.getDate())}`;
  $("time").value = hhmm(at);
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("form").requestSubmit();
}

// Frühere / Spätere: widen the current result, keep the list in place.
async function onMore(side) {
  const btn = $(side);
  if (!lastResult || btn.disabled) {
    return;
  }
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Lädt …";
  try {
    lastResult = await Planner.extend(lastResult, side);
    render();
  } catch (err) {
    $("status").className = "error";
    $("status").textContent = `Fehler: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

initInputs();
Timeline.init();
$("earlier").addEventListener("click", () => onMore("earlier"));
$("later").addEventListener("click", () => onMore("later"));
placeFields.forEach((f) => f.init());
PlacesEditor.init();
$("swap").addEventListener("click", onSwap);
$("add-dest").addEventListener("click", Destinations.park);
["origin", "place"].forEach((id) => $(id).addEventListener("input", markPlaces));
markPlaces();
$("pick-date").addEventListener("click", onPickDate);
$("now").addEventListener("click", onNow);
document.querySelectorAll(".place .clear").forEach((b) => b.addEventListener("click", onClear));
$("date").addEventListener("change", onDateChange);
$("date").addEventListener("blur", () => { $("date").hidden = true; });
$("form").addEventListener("submit", onSubmit);
walkBox.addEventListener("change", render);
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => fitLabels($("results")), DEBOUNCE_MS);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".place")) {
    closeSuggestions();
  }
});
// Close the other field's list when one field gets focus.
document.addEventListener("focusin", (e) => {
  if (e.target.id === "place") {
    placeFields[1].close();
  } else if (e.target.id === "origin") {
    placeFields[0].close();
  }
});
</script>
</body>
